  el.addEventListener("touchmove",e=>{if(!st)return;const T=e.touches[0],dy=T.clientY-st.y0,dx=T.clientX-st.x0,now=performance.now();
    if(!st.on){if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)){st=null;return}if(dy>8&&e.cancelable){st.on=true;st.y0=T.clientY;st.ly=T.clientY;st.lt=now;el.style.transition="none"}else return}
    if(e.cancelable)e.preventDefault();st.dy=Math.max(0,T.clientY-st.y0);st.v=st.v*.4+((T.clientY-st.ly)/Math.max(1,now-st.lt))*.6;st.ly=T.clientY;st.lt=now;
    el.style.transform=`translateY(${st.dy}px) scale(${1-Math.min(.08,st.dy/3000)})`;el.style.borderRadius=Math.min(34,st.dy/3)+"px"},{passive:false});
  const end=()=>{if(!st)return;const s=st;st=null;if(!s.on)return;eat();
    if(s.dy>innerHeight*.2||(s.v>.45&&s.dy>18)){el.style.transition="transform .3s cubic-bezier(.2,.75,.25,1),opacity .3s";el.style.transform=`translateY(${innerHeight*.9}px) scale(.92)`;el.style.opacity="0";setTimeout(onClose,260)}
    else{el.style.transition="transform .4s var(--sheet-ease),border-radius .4s";el.style.transform="";el.style.borderRadius=""}};
  el.addEventListener("touchend",end);el.addEventListener("touchcancel",end);

// effet iPhone : quand un écran s'ouvre par-dessus, l'appli derrière glisse un peu à gauche et s'assombrit
// l'écran du dessous (l'appli, ou l'écran précédent) recule un peu
function underEl(a,k,anim,dur){if(!a)return;const e=dur?"cubic-bezier(.2,.75,.25,1)":"var(--sheet-ease)",d=dur||500;a.style.transition=anim?`transform ${d}ms ${e},filter ${d}ms ${e}`:"none";
  a.style.transform=k>0?`translate3d(${-28*k}%,0,0)`:"";a.style.filter=k>0?`brightness(${1-.15*k})`:""}
const pushLay=me=>(k,anim,dur)=>{const b=me&&me.below&&!me.below.closed?me.below.el:null;if(b)underEl(b,k,anim,dur);else underlay(k,anim,dur)};

function underlay(k,anim,dur){const a=$("app");if(!a)return;const e=dur?"cubic-bezier(.2,.75,.25,1)":"var(--sheet-ease)",d=dur||500;a.style.transition=anim?`transform ${d}ms ${e},filter ${d}ms ${e}`:"none";
  a.style.transform=k>0?`translate3d(${-28*k}%,0,0)`:"";a.style.filter=k>0?`brightness(${1-.15*k})`:""}
// glisser sur un écran : quart gauche → menu ; ailleurs vers la droite → retour ; vers la gauche → écran suivant
function bindPushSwipe(el,getMe){let g=null;
  el.addEventListener("pointerdown",e=>{if(e.button>0||e.target.closest(NOSWIPE))return;g={x:e.clientX,y:e.clientY,id:e.pointerId,zone:e.clientX<=ZONE(),hs:hScroller(e.target),h:[[e.clientX,performance.now()]]}});
  el.addEventListener("pointermove",e=>{if(!g||e.pointerId!==g.id)return;const dx=e.clientX-g.x,dy=e.clientY-g.y,me=getMe();
    if(!g.on){if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){g=null;return}
      if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.3){if(hsBlocks(g.hs,dx)){g=null;return}g.mode=dx>0?(g.zone?"menu":"back"):(fwdHas()?"fwd":null);if(!g.mode){g=null;return}
        g.on=1;g.x=e.clientX-(dx>0?12:-12);try{el.setPointerCapture(e.pointerId)}catch(_){}if(g.mode==="menu"){drawerGrab();g.base=DRW.q}}else return}
    g.h.push([e.clientX,performance.now()]);if(g.h.length>10)g.h.shift();const d=e.clientX-g.x;
    if(g.mode==="menu"){drawerSet(g.base+Math.max(0,d)/($("menu").offsetWidth||320));return}
    if(g.mode==="fwd"){fwdDrag(g,Math.min(0,d));return}
    g.dx=Math.max(0,d);el.style.transition="none";el.style.transform=`translateX(${g.dx}px)`;me.uLay(1-g.dx/innerWidth,false)});
  const up=e=>{if(!g||e.pointerId!==g.id)return;const s=g;g=null;if(!s.on)return;const v=velo(s.h),me=getMe();
    if(s.mode==="menu"){drawerEnd(DRW.q,v,"open");return}
    if(s.mode==="fwd"){fwdEnd(s,-v);return}
    el.style.transition="";const W=innerWidth;
    if((s.dx>W*.35&&v>-.2)||(v>.3&&s.dx>20)){const dur=Math.round(Math.max(170,Math.min(400,(W-s.dx)/Math.max(.9,v))));el.style.transition=`transform ${dur}ms cubic-bezier(.2,.75,.25,1)`;el._dur=dur;me.close()}
    else{el.style.transition="transform .4s var(--sheet-ease)";el.style.transform="";me.uLay(1,true,400);setTimeout(()=>{if(el.classList.contains("open"))el.style.transition=""},420)}};
  el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);
}

    // contenu partagé (Paramètres, Rappels) : il retourne dans le même écran plus bas dans l'historique s'il y en a un
    const done=()=>{if(node){let u=below;while(u&&(u.node!==node||u.closed))u=u.below;if(u)u.el.querySelector(".push-sc").appendChild(node);else $("stash").appendChild(node)}el.remove()};
    el.style.pointerEvents="none";if(!instant&&me&&me.reopen)FWDS.push(me.reopen);if(instant){done();if(under)underEl(under.el,0,false);else if(!document.querySelector(".push.open"))underlay(0,false);return}el.classList.remove("open");el.style.transform="";uLay(0,true,el._dur);setTimeout(done,480);

  const rr=()=>{if(!render)return;const y=sc.scrollTop;render(body,rr);sc.scrollTop=y};
  if(!FWD_OPENING)FWDS.length=0;me=curPush={el,render:rr,close,id:id||"t:"+title,tool:true,below,uLay,node};el.style.zIndex=35;

const PER_STEP={w:7,m:30,q:91,y:365},PER_YEAR={w:52,m:12,q:4,y:1};

const nextOf=(per,d,day)=>per==="w"?addDays(d,7):addMonthsDay(d,per==="q"?3:per==="y"?12:1,day);
const PER_CH=[["m","Chaque mois"],["y","Chaque année"],["q","Chaque trimestre"],["w","Chaque semaine"]];
// marques d'abonnements connues : 2 paiements suffisent pour les reconnaître
const SUB_BRANDS=/netflix|spotify|deezer|disney|canal ?\+?|amazon prime|prime video|youtube|apple|icloud|itunes|google one|google play|dropbox|onedrive|microsoft|office 365|xbox|playstation|psn|nintendo|adobe|chatgpt|openai|claude|anthropic|twitch|paramount|crunchyroll|qobuz|tidal|audible|kindle|molotov|ocs|dazn|bein|rmc sport|basic ?fit|fitness park|keep ?cool|neoness|on air|orange|sfr|free mobile|freebox|bouygues|sosh|red by|b ?& ?you|edf|engie|totalenergies|veolia|navigo|uber one|linkedin|duolingo|strava|notion|canva|nordvpn|proton|le monde|figaro|mediapart|lequipe|blablacar|leboncoin|vinted|deliveroo|picard|hellofresh|cityscoot|lime|tinder|bumble|meetic/;
const YEAR_WORD=/annuel|annuelle|annual|yearly|\/an\b|12 ?mois|par an|renouvellement|cotisation (carte|annuelle)|adhesion/;
// nom propre : sans les références de prélèvement (P5678, n° de mandat…)
const subName=l=>{const n=nameOf(l).replace(/(^|\s)\S*\d\S*(?=\s|$)/g," ").replace(/\s{2,}/g," ").trim();return n||nameOf(l)};
function kindOf(name,c){const n=norm(name);
  return /assur|mutuelle|maif|macif|matmut|axa|allianz|groupama/.test(n)||c==="Assurances"?"Assurances":/loyer|logement|habitation/.test(n)||c==="Loyer & logement"?"Logement":/edf|engie|total ?energ|electri|gaz|eau|veolia|saur|suez/.test(n)||c==="Électricité & gaz"||c==="Eau"?"Énergie et eau":/free|sfr|orange|bouygues|sosh|red by|b&you|forfait|box|mobile|internet|telephone/.test(n)||c==="Internet & téléphone"?"Téléphone et internet":/assur|mutuelle|maif|macif|matmut|axa|allianz|groupama/.test(n)||c==="Assurances"?"Assurances":/credit|pret|emprunt|cofidis|cetelem/.test(n)||c==="Crédit & emprunt"?"Crédits":c===FEE_CAT||/\bp ?j\b|frais|cotisation/.test(n)?"Frais bancaires":"Abonnements"}
// même nom (mots raccourcis : « Apple Music » = « Apple musique »), dates régulières → paiement récurrent
const recKey=l=>{const k=keyOf(l);return k.split(" ").map(w=>w.slice(0,4)).join(" ")};
function recurring(){
  const man=S.recMan||[];
  const sig=S.ops.length+"|"+(S.ops[S.ops.length-1]||{}).id+"|"+todayISO()+"|"+(S.recHidden||[]).length+"|"+man.map(m=>m.id+m.amt+m.per+m.start+m.name+(m.ops||[]).length+m.a).join(",");
  if(REC_CACHE&&REC_CACHE.sig===sig)return REC_CACHE.list;
  const g={};
  for(const o of S.ops){if(o.t!=="dep"&&o.t!=="rem")continue;const k=recKey(o.l);if(!k)continue;const id=o.t+"|"+o.a+"|"+k;(g[id]=g[id]||[]).push(o)}
  const out=[],t=todayISO(),hid=new Set(S.recHidden||[]);
  // les écarts entre les dates collent-ils à une période ? (un mois oublié dans l'import ne casse rien)
  const PER=[["w",7,1,2],["m",30.44,5,3],["q",91.3,9,2],["y",365.25,18,1]];
  const regular=L=>{const gaps=[];for(let i=1;i<L.length;i++){const x=daysBetween(L[i-1].d,L[i].d);if(x>0)gaps.push(x)}if(!gaps.length)return null;
    for(const [k,step,tol,maxR] of PER){let ok=0,one=0;for(const x of gaps){const r=Math.round(x/step);if(r>=1&&r<=maxR&&Math.abs(x-r*step)<=tol*r){ok++;if(r===1)one++}}
      if(ok>=Math.ceil(gaps.length*.75)&&one>=Math.max(1,Math.ceil(gaps.length*.5)))return {k,step:PER_STEP[k]}}return null};
  const push=(id,L,per,extra={})=>{
    const lo=L[L.length-1];if(daysBetween(lo.d,t)>per.step*(per.k==="y"?1.25:1.6)+5)return false; // arrêté
    const day=+lo.d.slice(8);let next=nextOf(per.k,lo.d,day),late=null;
    while(next<t){if(!late&&daysBetween(next,t)>5)late=next;next=nextOf(per.k,next,day)}
    const prev=L.slice(0,-1).reverse().find(o=>Math.abs(o.m-lo.m)>.005);
    out.push(Object.assign({id,day,key:id.split("|")[2],ids:L.map(o=>o.id),t:lo.t,a:lo.a,name:subName(lo.l),cat:lo.c,amt:lo.m,old:prev&&daysBetween(prev.d,lo.d)<=per.step*4?prev.m:null,per:per.k,next,late,last:lo.d,n:L.length,
      year:lo.m*PER_YEAR[per.k],kind:kindOf(lo.l,lo.c)},extra));return true;
  };
  for(const id in g){
    if(hid.has(id))continue;
    const L=g[id].sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:a.k-b.k);let found=0;
    // 1) toute la suite est régulière (même si le prix a changé) : on garde le dernier prix
    const tail=L.slice(-8),per=L.length>=3&&regular(tail);
    const ms=tail.map(o=>o.m),stable=Math.max(...ms)<=Math.min(...ms)*1.25,lo0=L[L.length-1];
    const varCat=/^(Carburant|Courses|Restaurants & sorties|Shopping|Loisirs|Transports|Santé|Cadeaux)$/.test(lo0.c||"")||/\bstation\b/.test(norm(lo0.l));
    const fixedKind=lo0.c==="Abonnements"||!varCat&&(lo0.t==="rem"||SUB_BRANDS.test(norm(lo0.l))||kindOf(lo0.l,lo0.c)!=="Abonnements");
    // le dernier écart doit lui aussi coller à la période : deux paiements à 1 jour d'écart (forfait mobile le 4, box le 5) sont deux abonnements différents
    const lastOk=per&&(()=>{const x=daysBetween(tail[tail.length-2].d,tail[tail.length-1].d),st=PER_STEP[per.k],tl=(PER.find(q=>q[0]===per.k)||[0,0,5])[2],r=Math.round(x/st);return r>=1&&Math.abs(x-r*st)<=tl*r})();
    if(per&&lastOk&&(stable||fixedKind)&&push(id,tail,per))continue;

    const groups=[];for(const o of L){const gr=groups.find(x=>Math.abs(x.m-o.m)<=Math.max(.05,o.m*.02));if(gr)gr.L.push(o);else groups.push({m:o.m,L:[o]})}
    for(const gr of groups){if(gr.L.length<2)continue;const p2=regular(gr.L.slice(-8));if(p2&&(gr.L.length>=3||p2.k!=="w")&&push(id+"|"+gr.m.toFixed(2),gr.L.slice(-8),p2))found++}
    if(found)continue;
    const n=norm(L[L.length-1].l);
    // 3) marque connue : 2 paiements à la bonne distance suffisent, même si le prix a bougé
    if(L.length>=2&&SUB_BRANDS.test(n)){const p3=regular(L.slice(-4));if(p3&&p3.k!=="w"&&push(id,L.slice(-4),p3))continue}
    // 4) abonnement annuel : deux paiements à environ un an d'écart, prix proche (une hausse de prix est normale)
    if(L.length>=2&&L[L.length-1].t==="dep"){const x=L[L.length-1],y=L.slice(0,-1).reverse().find(o=>{const d=daysBetween(o.d,x.d);return d>=340&&d<=390});
      if(y&&Math.abs(x.m-y.m)<=Math.max(2,y.m*.3)&&push(id,[y,x],{k:"y",step:365}))continue}
    // 5) un seul paiement dont le libellé dit « annuel » : sans doute un abonnement annuel, à confirmer
    const x=L[L.length-1];if(x.t==="dep"&&YEAR_WORD.test(n)&&daysBetween(x.d,t)<=380)push(id,[x],{k:"y",step:365},{guess:true});
  }
  // abonnements ajoutés ou corrigés à la main : ils passent avant ce qui a été trouvé tout seul
  for(const m of man){if(!acc(m.a))continue;
    const key=m.key||recKey(m.name),linked=new Set(m.ops||[]);
    const L=S.ops.filter(o=>linked.has(o.id)||(o.a===m.a&&o.t===m.t&&recKey(o.l)===key&&Math.abs(o.m-m.amt)<=Math.max(1.5,m.amt*.25)&&(!m.start||o.d>=addDays(m.start,-400)))).sort((a,b)=>a.d<b.d?-1:1);

    // même nom ne suffit pas (« Free Forfait Tel » et « Free Forfait Freebox ») : il faut les mêmes opérations ou un prix proche
    const mine=new Set(L.map(o=>o.id));

const PER_TXT={m:"par mois",w:"par semaine",q:"par trimestre",y:"par an"};
// dates à venir d'un paiement récurrent entre deux dates
function occur(r,from,to){const out=[];let d=r.next;const nx=x=>nextOf(r.per,x,r.day||+r.next.slice(8));while(d<=to){if(d>=from)out.push(d);d=nx(d)}return out}
const dailyAccounts=()=>S.accounts.filter(a=>a.kind!=="Épargne"&&!a.invest);

/* ================= le mois : reste à vivre, prévision ================= */
function monthPlan(){
  const t=todayISO(),cur=dailyAccounts(),ids=new Set(cur.map(a=>a.id));
  const bal=cur.reduce((s,a)=>s+curBal(a.id),0);
  const rec=recurring().filter(r=>ids.has(r.a));
  // les prêts : une échéance par mois, sauf si leur prélèvement est déjà trouvé dans les abonnements
  for(const L of S.loans||[]){if(L.a&&!ids.has(L.a))continue;const c=loanCalc(L),amt=c.men+c.ins;if(c.done||!c.next||rec.some(r=>r.t==="dep"&&Math.abs(r.amt-amt)<=Math.max(1,amt*.03)))continue;
    rec.push({id:"loan|"+L.id,t:"dep",a:L.a||(cur[0]||{}).id,name:L.name,cat:"Crédit & emprunt",amt,per:"m",next:c.next,loan:L.id,year:amt*12,kind:"Crédits"})}
  const pay=rec.filter(r=>r.t==="rem"&&r.per==="m").sort((a,b)=>b.amt-a.amt)[0]||null;
  const until=pay&&daysBetween(t,pay.next)<=40?pay.next:endOfMonth(t);
  const outs=[];for(const r of rec)if(r.t==="dep")for(const d of occur(r,addDays(t,1),addDays(until,-1)))outs.push({r,d});
  const outSum=outs.reduce((s,x)=>s+x.r.amt,0);
  const rav=bal-outSum,days=Math.max(1,daysBetween(t,until));
  // prévision au dernier jour du mois : solde + tout ce qui doit encore arriver ou partir
  const eom=endOfMonth(t);let fc=bal;const ev=[];
  for(const r of rec)for(const d of occur(r,addDays(t,1),eom)){fc+=r.t==="rem"?r.amt:-r.amt;ev.push({r,d})}
  // dépenses courantes (hors prélèvements) à ce rythme d'ici la fin du mois
  const recIds=new Set(recurring().flatMap(r=>r.ids||[])),from90=addDays(t,-90);
  const firstOp=S.ops.reduce((m,o)=>o.d<m?o.d:m,t),span=Math.max(14,Math.min(90,daysBetween(firstOp>from90?firstOp:from90,t)));
  const var90=S.ops.filter(o=>o.t==="dep"&&o.d>addDays(t,-span)&&o.d<=t&&ids.has(o.a)&&!recIds.has(o.id)&&!o.pend).reduce((s,o)=>s+o.m,0);

}

const BP_CH=[["d1","Chaque jour",1],["d3","2 fois par semaine",3.5],["w1","Chaque semaine",7],["w2","Toutes les 2 semaines",14],["m1","Une fois par mois",31]];
const BP_ASK=c=>{const n=norm(c);return /course|aliment/.test(n)?"Tu fais tes courses…":/carbur|essence/.test(n)?"Tu fais le plein…":/restau|sortie/.test(n)?"Tu sors ou commandes à manger…":/transport/.test(n)?"Tu paies tes trajets…":/shopping|vetement|chaussure/.test(n)?"Tu fais du shopping…":/loisir|jeu|sport/.test(n)?"Tu te fais plaisir…":/internet|telephone|abonnement|electri|gaz|eau|loyer|logement|assur|credit/.test(n)?"Tu paies ça…":"Tu dépenses dans cette catégorie…"};
const BP_DEF=c=>/internet|telephone|abonnement|electri|gaz|eau|loyer|logement|assur|credit/.test(norm(c))?"m1":/carbur|essence/.test(norm(c))?"w2":"w1";
const budPer=c=>{const p=(S.budgetPer||{})[c];if(!p)return BP_DEF(c);if(typeof p==="string")return p;
  // anciens réglages (roue jour / semaine / mois) → le choix le plus proche
  const days=p.u==="d"?p.n:p.u==="w"?7*p.n:31;return BP_CH.reduce((x,y)=>Math.abs(y[2]-days)<Math.abs(x[2]-days)?y:x)[0]};
function budPace(b){const k=budPer(b.c),ch=BP_CH.find(x=>x[0]===k)||BP_CH[2],t=new Date(),dim=new Date(t.getFullYear(),t.getMonth()+1,0).getDate(),days=dim-t.getDate()+1,left=Math.max(0,b.left);
  if(b.left<=0)return {txt:"Plus rien à dépenser ce mois-ci",big:eurTile(0),sub:b.left<0?`Budget dépassé de ${eurTile(-b.left)}`:"Budget atteint",lab:ch[1]};
  if(k==="m1")return {txt:`Il te reste ${eurTile(left)} ce mois-ci`,big:eurTile(left),sub:"pour le reste du mois",lab:ch[1]};
  const n=Math.max(1,Math.round(days/ch[2]));
  return {txt:`Environ ${eurTile(left/n)} à chaque fois (${n} fois d'ici la fin du mois)`,big:"≈ "+eurTile(left/n),sub:`à chaque fois · encore ${n} fois d'ici la fin du mois`,lab:ch[1]}}
// fiche d'un budget : où tu en es, à ton rythme, les dernières dépenses, modifier ou supprimer
function openBudget(c,done){

      ${ops.length?`<div class="sec">Ce mois-ci <small>${ops.length}</small></div><div class="group">${ops.map(o=>`<div class="cell">${icon(catIcon(o.c))}<span class="ck cm-n">${esc(o.l||o.c)}<small>${longDate(o.d)}</small></span><span class="cv num">${eurAbs(o.m)}</span></div>`).join("")}</div>`:""}

      <button class="ghost danger" id="bdDel" style="margin-top:12px">${icon("trash")}Supprimer ce budget</button>`;
    w.querySelectorAll("[data-bf]").forEach(x=>x.onclick=()=>{S.budgetPer=Object.assign(S.budgetPer||{},{[c]:x.dataset.bf});save();draw(w);done&&done()});
    w.querySelector("#bdEd").onclick=async()=>{const r=await formSheet(`Budget · ${c}`,[{k:"b",label:"Par mois",type:"num",v:String(b.b).replace(".",","),icon:"cash",req:true}],"Enregistrer");
      if(r&&r.b>0){S.budgets[c]=r.b;save();renderAll();draw(w);done&&done()}};
    w.querySelector("#bdDel").onclick=async()=>{if(!await ask("Supprimer ce budget ?",`Le budget ${c} sera retiré. Tes dépenses ne sont pas touchées.`,"Supprimer",true))return;

    {mount:(w,close)=>{w._close=close;draw(w)}});

/* ---------- Calendrier ---------- */
const CAL={ym:null,sel:null,f:"all",dir:0};
// tout ce qui se passe dans un mois : les vraies opérations + ce qui est prévu (abonnements, salaires, frais)
function calMonth(ym){
  const from=ym+"-01",to=endOfMonth(from),t=todayISO(),by={},rec=recurring(),of=new Map();
  for(const r of rec)for(const id of r.ids||[])of.set(id,r);
  const put=(d,e)=>(by[d]=by[d]||[]).push(e);
  for(const o of S.ops){if(o.d<from||o.d>to||o.t==="tri")continue;const r=of.get(o.id);
    put(o.d,{k:"op",o,t:o.t,name:o.l||o.c||TYPES[o.t].l,amt:o.m,a:o.a,cat:o.c,r,pend:!!o.pend})}
  if(to>=t){const st=from>t?from:t;
    for(const r of rec)for(const d of occur(r,st,to)){if((by[d]||[]).some(e=>e.r===r))continue;put(d,{k:"plan",t:r.t,name:r.name,amt:r.amt,a:r.a,cat:r.cat,r})}
    for(const a of S.accounts)if(a.fees&&a.feeAmt>0){const last=S.ops.filter(o=>o.a===a.id&&isFee(o,a)).sort((x,y)=>x.d<y.d?1:-1)[0];if(!last)continue;const fd=+last.d.slice(8);let d=addMonthsDay(last.d,1,fd);while(d<st)d=addMonthsDay(d,1,fd);
      if(d<=to&&!(by[d]||[]).some(e=>e.a===a.id&&Math.abs(e.amt-a.feeAmt)<.01))put(d,{k:"plan",t:"dep",name:feeName(a),amt:a.feeAmt,a:a.id,cat:FEE_CAT,fee:1})}
    for(const L of S.loans||[]){const c=loanCalc(L),amt=c.men+c.ins;if(rec.some(r=>r.t==="dep"&&Math.abs(r.amt-amt)<=Math.max(1,amt*.03)))continue;
      for(const x of c.rows)if(x.d>=st&&x.d<=to)put(x.d,{k:"plan",t:"dep",name:L.name,amt,a:L.a,cat:"Crédit & emprunt",loan:L})}}
  return by;
}
const calKind=e=>(e.r&&e.r.t==="dep")||e.loan?"sub":e.t==="rem"?"in":e.t==="dep"?"out":e.t==="pl"?"pl":"tr";
const CAL_F=[["all","Tout"],["sub","Abonnements"],["in","Rentrées"],["out","Dépenses"],["plan","Prévu"]];
const calKeep=(e,f)=>f==="all"||(f==="plan"?e.k==="plan":calKind(e)===f||(f==="in"&&e.t==="rem"));
const calT=v=>Math.abs(v)>=100?Math.round(Math.abs(v)).toLocaleString("fr-FR").replace(/\u202f|\u00a0/g," ")+" "+BSYM():eurTile(v);
const shortAmt=v=>{const a=Math.abs(v);return a>=1000?(a/1000).toFixed(a>=10000?0:1).replace(".",",")+"k":Math.round(a)+""};

  const by=calMonth(CAL.ym),first=pd(CAL.ym+"-01"),dim=+endOfMonth(CAL.ym+"-01").slice(8),lead=(first.getDay()+6)%7;
  const all=Object.values(by).flat(),f=CAL.f,keep=e=>calKeep(e,f);

  for(let d=1;d<=dim;d++){const iso=CAL.ym+"-"+String(d).padStart(2,"0"),L=(by[iso]||[]).filter(keep);

    <div class="hscroll cal-f">${CAL_F.map(([k,l])=>`<button class="chip ${f===k?"on":""}" data-cf="${k}">${l}</button>`).join("")}</div>

    </div>

  const up=e=>{if(!st||e.pointerId!==st.id)return;const dx=e.clientX-st.x;st=null;if(Math.abs(dx)>50){const b=gr.querySelector(".cal-d");gr.addEventListener("click",x=>{x.stopPropagation();x.preventDefault()},{capture:true,once:true});setTimeout(()=>{gr.style.transform="";},0);move(dx<0?1:-1)}else{gr.style.transition="transform .3s var(--sheet-ease),opacity .3s";gr.style.transform="";gr.style.opacity=""}};

function autoRun(){
  const R=S.autoRec||{},t=todayISO();let n=0;
  for(const id in R){const a=R[id];if(!a.on||!acc(a.a))continue;
    if(!a.day)a.day=+a.next.slice(8);const nx=d=>nextOf(a.per,d,a.day);
    let guard=0;while(a.next<=t&&guard++<24){
      const d=a.next,dup=S.ops.some(o=>o.a===a.a&&o.t===a.t&&Math.abs(o.m-a.m)<=Math.max(.5,a.m*.05)&&Math.abs(daysBetween(o.d,d))<=7&&recKey(o.l)===a.key);
      if(!dup){S.ops.push({id:uid(),k:++S.seq,a:a.a,d,t:a.t,c:a.c||"",l:a.l,m:a.m,n:"",auto:1,pend:1});n++;const y=+d.slice(0,4);if(!S.years.includes(y)){S.years.push(y);S.years.sort((x,z)=>x-z)}}
      a.next=nx(d)}}
  if(n){save();renderAll()}return n;
}

const clamp01=v=>Math.max(0,Math.min(1,v));
function rateOf(ym){const m=monthStats(ym);return m.g>0?(m.g-m.d)/m.g:null}
function scoreData(){
  const t=todayISO(),last3=[1,2,3].map(i=>addMonths(t.slice(0,7)+"-01",-i).slice(0,7));
  const st=last3.map(ym=>monthStats(ym)),inc=st.reduce((s,m)=>s+m.g,0),exp=st.reduce((s,m)=>s+m.d,0);
  const rate=inc>0?(inc-exp)/inc:0,avgExp=exp/3;
  const sav=S.accounts.filter(a=>a.kind==="Épargne").reduce((s,a)=>s+curBal(a.id),0),cover=avgExp?sav/avgExp:0;
  const bl=budgetRows(last3[0]),bOk=bl.length?bl.filter(b=>b.p<=1).length/bl.length:null;
  const since=addDays(t,-365),fees=S.ops.filter(o=>o.d>=since&&o.t==="dep"&&o.c===FEE_CAT).reduce((s,o)=>s+o.m,0)-S.ops.filter(o=>o.d>=since&&o.t==="rem"&&o.c===FEE_REF).reduce((s,o)=>s+o.m,0);
  // jours dans le rouge sur 90 jours (comptes courants), en remontant le temps
  const ids=new Set(dailyAccounts().map(a=>a.id));let bal=dailyAccounts().reduce((s,a)=>s+curBal(a.id),0),neg=0;
  const ops=S.ops.filter(o=>ids.has(o.a)&&o.d>addDays(t,-90)&&inYear(o,curYear())).sort((a,b)=>a.d<b.d?1:-1);let i=0;
  for(let k=0;k<90;k++){const day=addDays(t,-k);if(bal<-0.004)neg++;while(i<ops.length&&ops[i].d===day){bal-=sv(ops[i]);i++}}
  const parts=[
    {k:"rate",n:"Épargne chaque mois",max:30,p:30*clamp01(rate/.2),v:pct(rate*100),tip:rate>=.2?"Bravo : tu mets au moins 20 % de côté.":rate>0?"Vise 10 à 20 % de tes rentrées mis de côté chaque mois.":"Tu dépenses tout ce que tu gagnes : commence par 5 % mis de côté dès la paie."},
    {k:"cover",n:"Épargne de sécurité",max:25,p:25*clamp01(cover/3),v:cover.toFixed(1).replace(".",",")+" mois",tip:cover>=3?"Tu as plus de 3 mois de dépenses de côté : parfait en cas de coup dur.":"Vise 3 mois de dépenses sur un livret, pour les imprévus."},
    {k:"budget",n:"Budgets respectés",max:20,p:bOk==null?10:20*bOk,v:bOk==null?"aucun budget":Math.round(bOk*100)+" %",tip:bOk==null?"Crée quelques budgets : c'est le meilleur moyen de garder le contrôle.":bOk>=1?"Tous tes budgets ont été tenus le mois dernier.":"Ajuste les budgets trop serrés, ou surveille les catégories qui débordent."},
    {k:"fees",n:"Frais bancaires",max:10,p:10*clamp01(1-Math.max(0,fees)/60),v:eurTile(Math.max(0,fees))+" /an",tip:fees<=0?"Aucun frais bancaire sur un an.":"Compare avec une banque moins chère si les frais s'accumulent."},
    {k:"neg",n:"Jamais dans le rouge",max:15,p:Math.max(0,15-neg),v:neg?plural(neg,"jour")+" à découvert":"0 jour",tip:neg?"Garde une petite marge sur ton compte courant pour éviter les agios.":"Aucun découvert sur les 3 derniers mois."}];
  const total=Math.round(parts.reduce((s,x)=>s+x.p,0));
  return {total,parts,rate,cover,lvl:total>=80?"Excellent":total>=60?"Bon":total>=40?"Moyen":"À améliorer"};
}

function loanCalc(L){
  const P=+L.P||0,n=Math.max(1,Math.round(+L.months||1)),r=(+L.rate||0)/100/12,ins=+L.ins||0;
  const base=r?P*r/(1-Math.pow(1+r,-n)):P/n,men=+L.men>0?+L.men:base;
  const ex=(L.extra||[]).slice().sort((a,b)=>a.d<b.d?-1:1),t=todayISO(),rows=[];
  let bal=P,k=0,ei=0,bad=false;
  while(bal>.005&&k<n+480){const d=addMonths(L.start,k);
    while(ei<ex.length&&ex[ei].d<=d){bal=Math.max(0,bal-ex[ei].m);ei++}
    if(bal<=.005)break;
    const it=bal*r,pr=Math.min(bal,men-it);if(pr<=0){bad=true;break}
    bal-=pr;rows.push({d,it,pr,bal,pay:pr+it});k++}
  const paid=rows.filter(x=>x.d<=t),left=rows.filter(x=>x.d>t),exPaid=ex.filter(e=>e.d<=t).reduce((s,e)=>s+e.m,0);
  const capPaid=Math.min(P,paid.reduce((s,x)=>s+x.pr,0)+exPaid),intPaid=paid.reduce((s,x)=>s+x.it,0),intLeft=left.reduce((s,x)=>s+x.it,0);
  const end=rows.length?rows[rows.length-1].d:L.start;
  return {P,men,ins,rows,paidN:paid.length,leftN:left.length,capPaid,intPaid,capLeft:Math.max(0,P-capPaid),intLeft,intTot:intPaid+intLeft,insTot:ins*rows.length,end,next:left[0]?left[0].d:null,p:P?capPaid/P:1,done:!left.length&&!bad,bad,started:L.start<=t};
}

function goalPace(g){const L=goalLog(g),t=todayISO(),from=addMonths(t,-3),m3=L.filter(x=>x.d>from).reduce((s,x)=>s+x.m,0);

}

// simulation mois par mois : versements, intérêts, plafond, impôt sur les gains, inflation
function simulate({c,m,r,y,cap,tax,inf}){
  const n=Math.round(y*12);let b=c,put=c,capAt=null;const pts=[b];
  for(let i=1;i<=n;i++){b*=1+r/100/12;let add=m;if(cap&&put+add>cap){add=Math.max(0,cap-put);if(capAt==null)capAt=i}b+=add;put+=add;if(i%12===0||i===n)pts.push(b)}
  const gain=b-put,net=put+gain*(1-tax),real=net/Math.pow(1+inf/100,y);
  return {b,put,gain,net,real,capAt,pts};
}

  const words=n.split(" ").filter(w=>w.length>2&&!/^(combien|depense|depenses|depensé|j ai|est|que|quoi|mes|mon|les|des|pour|dans|cette|annee|mois|semaine|dernier|derniere|chez|plus|grosse|gros|tout|total|ete|hiver|printemps|automne|aujourd|hier|gagne|recu|argent|euros|avec|sur|depuis|janvier|fevrier|mars|avril|mai|juin|juillet|aout|septembre|octobre|novembre|decembre|20\d\d)$/.test(w));
  const chez=(/\bchez ([a-z0-9]+)/.exec(n)||[])[1],catW=c=>norm(c.name).split(/[^a-z0-9]+/).filter(Boolean);
  const cat=chez&&S.ops.some(o=>norm(o.l).includes(chez))?null:S.cats.find(c=>words.some(w=>w.length>=3&&!/^(par|ans|une|sur|aux|avec)$/.test(w)&&catW(c).some(x=>x===w||(w.length>=4&&x.startsWith(w))||(x.length>=4&&w.startsWith(x)))))||(chez&&S.ops.some(o=>norm(o.l).includes(chez))?null:(c=>c?S.cats.find(x=>x.name===c):null)(askCat(n))),tags=[...new Set(S.ops.flatMap(o=>o.tags||[]))];
  const tg=tags.find(x=>words.includes(norm(x))),ac=S.accounts.find(a=>words.includes(norm(a.name)));
  let sel=o=>o.t===type&&o.d>=from&&o.d<=to,subj="";
  if(tg){const f=sel;sel=o=>f(o)&&(o.tags||[]).includes(tg);subj=` avec l'étiquette « ${tg} »`}
  else{const sub=S.cats.flatMap(c=>(c.subs||[]).map(s=>[c.name,s])).find(([,s])=>words.some(w=>norm(s).includes(w)));
    if(sub){const f=sel;sel=o=>f(o)&&o.c===sub[0]&&o.s===sub[1];subj=` en ${sub[1]}`}

    else if(ac){const f=sel;sel=o=>f(o)&&o.a===ac.id;subj=` sur ${ac.name}`}
    else if(words.length||chez){const w=chez&&S.ops.some(o=>norm(o.l).includes(chez))?chez:words.find(w=>!/^(par|ans|une|sur|aux|avec)$/.test(w)&&S.ops.some(o=>norm(o.l).includes(w)));if(w){const f=sel;sel=o=>f(o)&&norm(o.l).includes(w);subj=` chez « ${w} »`}}}
  const L=sortOps(S.ops.filter(sel)),tot=L.reduce((s,o)=>s+o.m,0);
  if(/plus grosse|plus gros|plus cher/.test(n)){const b=L.slice().sort((a,b)=>b.m-a.m)[0];return b?{a:`Ta plus grosse ${earn?"rentrée":"dépense"}${subj} ${lab} : ${eurAbs(b.m)}, ${b.l||b.c} ${onDate(b.d)}.`,ops:[b]}:{a:`Rien trouvé${subj} ${lab}.`}}

}

function shLocal(){const X=S.shared=S.shared||{};
  if(!X.groups){ // ancienne forme : une seule liste de personnes
    const g={id:"g"+uid(),name:"Dépenses partagées",members:[{id:"me",name:"Moi"}].concat((X.people||[]).map(p=>({id:"p:"+p,name:p}))),

async function shLoad(){
  if(!shOnline())return;
  try{const {data:G,error}=await SB.from("share_groups").select("id,name,code,owner");if(error)throw error;
    const ids=(G||[]).map(g=>g.id),none=["00000000-0000-0000-0000-000000000000"];

      members:(M.data||[]).filter(m=>m.group_id===g.id).map(m=>({id:m.user_id,name:m.user_id===USER.id?"Moi":m.name,email:m.email})),
      items:(I.data||[]).filter(i=>i.group_id===g.id).map(i=>({id:i.id,d:i.d,l:i.label,m:+i.amount,paid:i.paid_by,split:i.split,settle:i.settle,by:i.by_user}))}));

// solde de chacun : ce qu'il a payé moins sa part (positif : on lui doit de l'argent)
function shNet(g){const n={};for(const m of g.members)n[m.id]=0;for(const it of g.items){n[it.paid]=(n[it.paid]||0)+it.m;for(const [k,f] of Object.entries(it.split))n[k]=(n[k]||0)-it.m*f}return n}
function shPlan(g){const n=shNet(g),cr=[],db=[];for(const [k,v] of Object.entries(n)){if(v>.005)cr.push([k,v]);else if(v<-.005)db.push([k,-v])}
  cr.sort((a,b)=>b[1]-a[1]);db.sort((a,b)=>b[1]-a[1]);const out=[];let i=0,j=0;
  while(i<db.length&&j<cr.length){const m=Math.min(db[i][1],cr[j][1]);out.push({from:db[i][0],to:cr[j][0],m:Math.round(m*100)/100});db[i][1]-=m;cr[j][1]-=m;if(db[i][1]<.005)i++;if(cr[j][1]<.005)j++}
  return out}

/* ---------- comparaison avec l'an dernier (Analyse) ---------- */
function compareHTML(prefix,acc){
  if(!can("compare"))return "";
  const pp=(+prefix.slice(0,4)-1)+prefix.slice(4);
  const now=sumBy(prefix,depOf,acc),bef=sumBy(pp,depOf,acc),tn=Object.values(now).reduce((s,v)=>s+v,0),tb=Object.values(bef).reduce((s,v)=>s+v,0);
  if(!tb)return "";
  const ch=Object.keys(Object.assign({},now,bef)).map(c=>[c,(now[c]||0)-(bef[c]||0)]).filter(x=>Math.abs(x[1])>=5).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).slice(0,5);
  const lab=prefix.length>4?MONTHS[+prefix.slice(5)-1]+" "+pp.slice(0,4):pp.slice(0,4);
  return `<div class="sec">Par rapport à ${lab}</div><div class="card tool-card"><div class="fc-row"><span>Dépenses</span><b class="num">${eurTile(tn)} <small class="${tn>tb?"up":"down"}">${tn>tb?"+":"−"}${Math.abs(Math.round((tn/tb-1)*100))} %</small></b></div>
    ${ch.map(([c,d])=>`<div class="fc-row s"><span>${icon(catIcon(c))}${esc(c)}</span><span class="num ${d>0?"up":"down"}">${eur(d,true)}</span></div>`).join("")}</div>`;
}

async function fxLoad(force){const c=S.fxCache;if(!force&&c&&c.d===todayISO())return c;if(!navigator.onLine)return c||null;
  try{const r=await fetch("https://open.er-api.com/v6/latest/EUR",{cache:"no-store"});const j=await r.json();if(j.result!=="success"||!j.rates)throw 0;
    S.fxCache={d:todayISO(),t:(j.time_last_update_unix||0)*1000,rates:j.rates};saveLocal();return S.fxCache}catch(e){return c||null}}
function fxRate(from,to=BASE()){const c=S.fxCache;if(from===to)return 1;if(!c||!c.rates[from]||!c.rates[to])return null;return c.rates[to]/c.rates[from]}

function appBack(){
  const ls=document.getElementById("lockScr");if(ls){const x=ls.classList.contains("setup")&&ls.querySelector(".lk-x");if(x)x.click();return true}
  if(document.getElementById("onb"))return true;
  const rp=document.querySelector("#report .rp-x");if(rp){rp.click();return true}
  const wr=document.querySelector(".wrap .wr-x");if(wr){wr.click();return true}
  const sw=[...document.querySelectorAll("#sheets .sw.open")].pop();if(sw&&sw._close){sw._close();return true}
  if($("drawer").classList.contains("open")){closeDrawer();return true}
  if(curPush){curPush.close();return true}
  if(navAnim)return true;
  if(cur===PG.home)return false;
  const prev=NAVBACK.length?NAVBACK.pop():PG.home;
  if(prev==null||prev===cur)return false;
  NAVFWD.push(cur);NAVDIR=-1;go(prev,true);return true;

let BACK_ARMED=false,BACK_SKIP=0;
// iPhone / iPad : le système a son propre geste « retour » (glisser depuis le bord gauche) qui suit l'historique du navigateur.
// Zerly n'y ajoute donc rien : ses gestes à lui (menu, retour, avant) se chargent de tout, et le menu n'est jamais une « page ».
function iosNoHist(){return /iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1)}
function armBack(){if(BACK_ARMED||iosNoHist())return;try{history.pushState({fin:1},"",location.pathname+location.search);BACK_ARMED=true}catch(e){}}
addEventListener("popstate",()=>{BACK_ARMED=false;if(iosNoHist())return;   // ancien historique sur iPhone : on ne touche à rien
  if(performance.now()<BACK_SKIP){armBack();return}   // le geste trackpad a déjà fait le retour
  const done=appBack();if(done&&canBack())armBack();else if(done)setTimeout(()=>{if(canBack())armBack()},500)});
// clavier (Mac/PC) : Échap, ⌘[ , Alt+←
addEventListener("keydown",e=>{if(e.target.closest&&e.target.closest("input,textarea,select,[contenteditable]"))return;
  if(e.key==="Escape"||(e.metaKey&&e.key==="[")||(e.altKey&&e.key==="ArrowLeft")){if(appBack()){e.preventDefault();BACK_SKIP=performance.now()+400}}});
// trackpad du Mac : glisser à deux doigts vers la droite = retour, la page suit les doigts comme sur iPhone
(()=>{
  let g=null,timer=0,quietUntil=0,sideUntil=0;
  const W=()=>innerWidth;
  // une zone qui défile de côté (graphiques, listes horizontales) garde le geste pour elle
  const sideScroll=(t,dx)=>{for(let n=t;n&&n!==document.body;n=n.parentElement){if(!(n instanceof Element))continue;const cs=getComputedStyle(n);if(/(auto|scroll)/.test(cs.overflowX)&&n.scrollWidth>n.clientWidth+1){if(dx<0?n.scrollLeft>0:n.scrollLeft<n.scrollWidth-n.clientWidth-1)return true}}return false};
  // dx>0 : doigts vers la droite (retour) ; dx<0 : vers la gauche (en avant)
  const target=(dx,x)=>{
    if(document.getElementById("lockScr")||document.getElementById("onb")||document.getElementById("report")||document.querySelector(".wrap")||document.querySelector("#sheets .sw.open"))return null;
    if($("drawer").classList.contains("open"))return dx<0?{k:"drawer"}:null;
    // pointeur dans le quart gauche : on tire le menu
    if(dx>0&&x<=ZONE())return {k:"home"};
    const pushes=document.querySelectorAll(".push.open");if(curPush&&pushes.length)return dx>0?{k:"push",el:pushes[pushes.length-1]}:fwdHas()?{k:"pfwd"}:null;
    if(dx<0){const f=NAVFWD.length?NAVFWD[NAVFWD.length-1]:null;return f!=null&&f!==cur?{k:"fwd",to:f}:fwdHas()?{k:"pfwd"}:null}
    // l'accueil est le point de départ : pas de retour
    if(cur===PG.home)return null;
    const prev=NAVBACK.length?NAVBACK[NAVBACK.length-1]:PG.home;
    if(prev==null||prev===cur)return null;
    return {k:"page",to:prev};
  };
  const show=()=>{const q=Math.max(0,Math.min(1,g.dx/W()));g.q=q;
    if(g.k==="page"){NAVDIR=-1;paint(cur,g.to,q)}
    else if(g.k==="fwd"){NAVDIR=1;paint(cur,g.to,q)}
    else if(g.k==="push"){g.el.style.transition="none";g.el.style.transform=`translateX(${q*W()}px)`;(curPush&&curPush.uLay||underlay)(1-q,false)}
    else if(g.k==="pfwd")g.q=Math.min(1,g.dx/W()*1.6);
    else if(g.k==="home"){const w=$("menu").offsetWidth||320;drawerFollow(g.base+g.dx/w);g.q=Math.min(1,g.dx/w)}
    else if(g.k==="drawer"){const w=$("menu").offsetWidth||320;drawerFollow(g.base-g.dx/w);g.q=Math.min(1,g.dx/w)}};
  const finish=()=>{timer=0;const st=g;g=null;if(!st)return;quietUntil=performance.now()+260;
    const v=st.v,go1=st.q>.33||(v>.6&&st.q>.03),dur=Math.max(150,Math.min(380,(1-st.q)*innerWidth/Math.max(.9,v)));
    if(st.k==="page"){
      if(go1){const from=cur,to=st.to;if(NAVBACK.length&&NAVBACK[NAVBACK.length-1]===to)NAVBACK.pop();NAVFWD.push(from);cur=to;bubbleTo(to);onEnter(to);NAVDIR=-1;BACK_SKIP=performance.now()+700;tween(from,to,st.q,dur,()=>settle(to))}
      else{NAVDIR=-1;tween(cur,st.to,st.q,260,()=>settle(cur),0)}}
    else if(st.k==="fwd"){const from=cur,to=st.to;
      if(go1){NAVFWD.pop();NAVBACK.push(from);armBack();cur=to;bubbleTo(to);onEnter(to);NAVDIR=1;tween(from,to,st.q,dur,()=>settle(to))}
      else{NAVDIR=1;tween(from,to,st.q,260,()=>settle(from),0)}}
    else if(st.k==="push"){st.el.style.transition="";if(go1){BACK_SKIP=performance.now()+700;st.el.style.transition="transform 280ms cubic-bezier(.2,.75,.25,1)";st.el._dur=280;curPush&&curPush.close()}else{st.el.style.transition="transform .4s var(--sheet-ease)";st.el.style.transform="";(curPush&&curPush.uLay||underlay)(1,true,400)}}
    else if(st.k==="pfwd"){if(go1)fwdOpen()}
    else if(st.k==="home"){const q=DRW.tg!=null?DRW.tg:DRW.q;drawerEnd(q,q>.12?Math.max(.35,Math.abs(v)):0)}
    else if(st.k==="drawer"){const q=DRW.tg!=null?DRW.tg:DRW.q;drawerEnd(q,st.q>.12?-Math.max(.35,Math.abs(v)):0)}};
  addEventListener("wheel",e=>{
    if(e.ctrlKey)return;                                  // pincement : rien
    const dx=-(e.deltaMode===1?e.deltaX*16:e.deltaX),dy=e.deltaY;  // doigts vers la droite = dx positif
    if(!g){
      if(performance.now()<sideUntil){sideUntil=performance.now()+420;return}   // la zone de côté termine son mouvement : pas de retour
      if(performance.now()<quietUntil){quietUntil=performance.now()+260;if(Math.abs(e.deltaX)>Math.abs(dy))e.preventDefault();return} // fin d'élan du geste précédent
      if(Math.abs(e.deltaX)<2||Math.abs(e.deltaX)<Math.abs(dy)*1.2)return;
      if(Math.abs(e.deltaX)>=2&&sideScroll(e.target,-dx)){sideUntil=performance.now()+420;return}
      if(navAnim||(e.target.closest&&e.target.closest(".noswipe")))return;
      const t=target(dx,e.clientX);if(!t)return;
      g={...t,dx:0,q:0,v:0,last:performance.now(),rev:t.k==="drawer"||t.k==="fwd"||t.k==="pfwd"};
      if(t.k==="home"||t.k==="drawer"){drawerGrab();g.base=DRW.q}
    }
    e.preventDefault();
    const now=performance.now(),dt=Math.max(1,now-g.last);g.last=now;
    const step=g.rev?-dx:dx;g.v=g.v*.6+(step/dt)*.4;
    g.dx=Math.max(0,g.dx+step);show();
    // les doigts ont quitté le trackpad : l'élan ralentit régulièrement → on termine tout de suite au lieu de traîner
    const a=Math.abs(step);g.peak=Math.max(g.peak||0,a);g.dec=a<=(g.prev||0)*.92?(g.dec||0)+1:0;g.prev=a;

  },{passive:false});
})();

function notifQueue(){

  const when=d=>bf===0?"Aujourd'hui":bf===1?"Demain":bf===2?"Après-demain":"Dans "+bf+" jours";

      else if(c.type==="cap"&&st.ok&&st.p>=.8)out.push({date:t,hour:h,tag:"chal:"+c.id+":80",title:chalName(c),body:`Attention : tu as déjà utilisé ${Math.round(st.p*100)} % de ton plafond.`})}}

    const lmK=addMonths(t.slice(0,7)+"-01",-1).slice(0,7);if(t.slice(8)==="01"&&!(S.wrapSeen||{})["m:"+lmK])out.push({date:t,hour:h,tag:"wrap:m:"+lmK,title:`Ton bilan ${deM(MONTHS[+lmK.slice(5)-1])} est disponible`,body:"Ne passe pas à côté : découvre comment s'est passé ton mois."});
    out.push({date:nx,hour:h,tag:"wrap:m:"+pm,title:`Ton bilan ${deM(MONTHS[+pm.slice(5)-1])} est disponible`,body:"Ne passe pas à côté : découvre comment s'est passé ton mois."});
    if(nx.slice(5,7)==="01")out.push({date:nx,hour:h,tag:"wrap:y:"+pm.slice(0,4),title:`Ton bilan de l'année ${pm.slice(0,4)} est prêt`,body:"Toute ton année en quelques images : à ne pas manquer !"})}
  const rec=recurring();

    for(const d of occur(r,addDays(t,bf),addDays(end,bf)))out.push({date:addDays(d,-bf),hour:h,tag:ty+":"+r.id+":"+d,title:r.t==="dep"?`${when(d)} : ${r.name}`:`${when(d)} : ${r.name} arrive`,body:r.t==="dep"?`${eurAbs(r.amt)} vont partir${acc(r.a)?" de "+accName(r.a):""}.`:`${eurAbs(r.amt)} prévus${acc(r.a)?" sur "+accName(r.a):""}.`})}
  if(T.loan)for(const L of S.loans||[]){const c=loanCalc(L),amt=c.men+c.ins;if(rec.some(r=>r.t==="dep"&&Math.abs(r.amt-amt)<=Math.max(1,amt*.03)))continue;

async function notifWrite(o){try{const c=await caches.open(NOTIF_CACHE);await c.put(NOTIF_URL,new Response(JSON.stringify(o),{headers:{"Content-Type":"application/json"}}))}catch(e){}}

async function notifRefresh(){

async function notifyDue(){

  const chg=()=>{saveLocal();notifRefresh();rr()};
  el.querySelector("#nfMain").onclick=async()=>{await setNotif(!notifOn());rr();renderProfile()};
  el.querySelectorAll("[data-nt]").forEach(b=>b.onclick=()=>{N.types[b.dataset.nt]=!N.types[b.dataset.nt];chg()});
  el.querySelectorAll("[data-nh]").forEach(b=>b.onclick=()=>{N.hour=+b.dataset.nh;chg()});
  el.querySelectorAll("[data-nb]").forEach(b=>b.onclick=()=>{N.before=+b.dataset.nb;chg()});
  el.querySelector("#nfWe").onclick=()=>{N.noWeekend=!N.noWeekend;chg()};
  const ts=el.querySelector("#nfTest");if(ts)ts.onclick=async()=>{try{const reg=await navigator.serviceWorker.ready;await reg.showNotification("Zerly",{body:"Les notifications marchent 👌",tag:"fin-test",icon:"icon-192.png",badge:"icon-192.png"});toast("Notification envoyée")}catch(e){toast("Impossible d'envoyer la notification")}};
}})}
// appli ouverte en arrière-plan (ordinateur, Android) : on vérifie de temps en temps
setInterval(()=>{if(document.hidden)notifyDue()},15*60e3);
if("serviceWorker" in navigator)navigator.serviceWorker.addEventListener("message",e=>{if(e.data&&e.data.open==="rappels"){if(curPush&&curPush.id==="t:rem")return;openRemind()}});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")notifRefresh()});
setTimeout(()=>{if(notifOn()){notifRefresh();if(/[?&]rappels=1/.test(location.search)){history.replaceState(null,"",location.pathname);setTimeout(openRemind,600)}}},3000);

// pas de sélection de texte ni de glisser-déposer (glisser à 3 doigts sur Mac), sauf dans les champs
const EDITABLE="input,textarea,select,[contenteditable]";
document.addEventListener("selectstart",e=>{const t=e.target.nodeType===1?e.target:e.target.parentElement;if(!(t&&t.closest(EDITABLE)))e.preventDefault()});
document.addEventListener("dragstart",e=>{const t=e.target.nodeType===1?e.target:e.target.parentElement;if(!(t&&t.closest(EDITABLE)))e.preventDefault()});

/* ================= démarrage ================= */
rebuildTabs(true);setTimeout(updateRemindBadge,0);
resetForm();
renderHome();
renderProfile();
if(CLOUD_ON&&!S.owner&&!DEV_LOCAL)authShow("login");
showLock();
onboarding();
autoRun();
playSplash(false);
fxLoad();
startCloud();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator&&location.protocol.startsWith("http")&&!/localhost|127\.0\.0\.1/.test(location.hostname))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
