<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --sheet-ease:cubic-bezier(.32,.72,0,1);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --r-card:22px;
}
html[data-theme="light"]{
  --bg:#ECE8E0;--card:#F8F6F1;--card2:#F2EFE9;
  --text:#18231A;--text2:rgba(24,35,26,.70);--text3:rgba(24,35,26,.56);
  --fill:rgba(43,62,40,.07);--fill2:rgba(43,62,40,.12);--sep:rgba(43,62,40,.10);
  --ink:#2B3E28;--on-ink:#F2EFE9;
  --hero:linear-gradient(155deg,#34492F 0%,#2B3E28 50%,#1E2D1F 100%);--hero-fg:#F2EFE9;--hero-2:rgba(242,239,233,.68);--hero-fill:rgba(242,239,233,.10);--hero-line:#F2EFE9;--hero-glow:rgba(242,239,233,.16);--hero-shadow:0 1px 2px rgba(24,35,26,.08),0 14px 34px rgba(43,62,40,.22);
  --wm:#2B3E28;--wm-o:.08;
  --glass:rgba(248,246,241,.72);--glass-line:rgba(43,62,40,.10);--glass-shadow:0 10px 34px rgba(24,35,26,.14),0 1px 3px rgba(24,35,26,.06);
  --bubble:rgba(43,62,40,.08);--bubble-line:rgba(43,62,40,.10);--bubble-hi:rgba(255,255,255,.85);
  --card-shadow:0 1px 2px rgba(24,35,26,.05),0 0 0 .5px rgba(43,62,40,.06);
  --scrim:rgba(24,35,26,.34);--bar:rgba(236,232,224,.84);
  --accent:#8B6530;--accent-2:#A08571;--pos:#3D6B33;--neg:#A4442F;--sheet-bg:#F8F6F1;
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#0F1710;--card:#18231A;--card2:#1E2B20;
  --text:#F2EFE9;--text2:rgba(242,239,233,.70);--text3:rgba(242,239,233,.52);
  --fill:rgba(242,239,233,.07);--fill2:rgba(242,239,233,.12);--sep:rgba(242,239,233,.09);
  --ink:#F2EFE9;--on-ink:#18231A;
  --hero:linear-gradient(155deg,#3A5434 0%,#2B3E28 50%,#1B281C 100%);--hero-fg:#F2EFE9;--hero-2:rgba(242,239,233,.62);--hero-fill:rgba(242,239,233,.10);--hero-line:#F2EFE9;--hero-glow:rgba(242,239,233,.16);--hero-shadow:0 14px 40px rgba(0,0,0,.45),inset 0 0 0 .5px rgba(242,239,233,.08);
  --wm:#F2EFE9;--wm-o:.07;
  --glass:rgba(24,35,26,.66);--glass-line:rgba(242,239,233,.10);--glass-shadow:0 10px 34px rgba(0,0,0,.55);
  --bubble:rgba(242,239,233,.10);--bubble-line:rgba(242,239,233,.14);--bubble-hi:rgba(242,239,233,.18);
  --card-shadow:0 0 0 .5px rgba(242,239,233,.07);
  --scrim:rgba(5,10,6,.58);--bar:rgba(15,23,16,.80);
  --accent:#C49A5E;--accent-2:#A08571;--pos:#9CC08A;--neg:#E08B73;--sheet-bg:#141E15;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select,[contenteditable],[contenteditable] *{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img,svg{-webkit-user-drag:none}
html,body{overscroll-behavior-x:none;margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---------- pages ---------- */
#app{position:fixed;inset:0;overflow:hidden;background:var(--bg);transition:background-color .4s}
#pages{position:absolute;inset:0;touch-action:pan-y}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;visibility:hidden;will-change:transform,opacity;background:var(--bg)}
.page.active{visibility:visible}
.content{padding:0 18px calc(var(--safe-b) + 128px)}
.topbar{position:sticky;top:0;z-index:5;height:calc(var(--safe-t) + 46px);padding-top:var(--safe-t);display:flex;align-items:center;justify-content:center;margin-bottom:-6px;transition:background-color .3s,box-shadow .3s}
.topbar .tt{font-size:16px;font-weight:600;opacity:0;transform:translateY(4px);transition:opacity .25s,transform .25s}
.page.scrolled .topbar{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);box-shadow:0 .5px 0 var(--sep)}
.page.scrolled .topbar .tt{opacity:1;transform:none}
.large{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.025em;margin:2px 0 18px}
.eyebrow{font-size:13px;font-weight:600;color:var(--text2);margin:0 0 2px}
.eyebrow::first-letter{text-transform:uppercase}
.sec{display:flex;align-items:baseline;justify-content:space-between;font-size:20px;font-weight:700;letter-spacing:-.02em;margin:28px 2px 12px}
.sec small{font-size:15px;font-weight:500;color:var(--text2);letter-spacing:0}
.sec button{font-size:15px;font-weight:500;color:var(--text2)}

/* ---------- accueil ---------- */
.home-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:2px 0 18px}
.home-head .large{margin:0}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--fill2);display:grid;place-items:center;overflow:hidden;font-weight:600;font-size:15px;flex:none;position:relative}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.hero{background:var(--hero);color:var(--hero-fg);border-radius:28px;padding:20px 20px 14px;position:relative;overflow:hidden;box-shadow:var(--hero-shadow)}
.hero .lbl{font-size:14px;font-weight:500;color:var(--hero-2);display:flex;justify-content:space-between;align-items:center}
.hero .big{font-size:42px;font-weight:700;letter-spacing:-.035em;margin:6px 0 2px;line-height:1.05}
.hero .big .cts{font-size:26px;opacity:.55}
.hero .delta{font-size:14px;color:var(--hero-2);min-height:18px}
.hero .delta b{color:var(--hero-fg);font-weight:600}
.chart{position:relative;height:132px;margin:16px -20px -14px;touch-action:none;cursor:crosshair}
.chart svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.chart .dot{position:absolute;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:var(--hero-fg);box-shadow:0 0 0 5px var(--hero-glow);pointer-events:none}
.chart .cursor{position:absolute;top:0;bottom:0;width:1px;background:var(--hero-2);pointer-events:none;opacity:0;transition:opacity .15s}
.chart.scrub .cursor{opacity:1}
.ranges{display:flex;gap:4px;margin-top:6px;background:var(--hero-fill);border-radius:12px;padding:3px}
.ranges button{flex:1;height:30px;border-radius:9px;font-size:13px;font-weight:600;color:var(--hero-2);transition:background-color .25s,color .25s}
.ranges button.on{background:rgba(255,255,255,.16);color:var(--hero-fg)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border-radius:18px;padding:13px 12px 12px;box-shadow:var(--card-shadow);min-width:0}
.tile .k{font-size:12.5px;font-weight:500;color:var(--text2);display:flex;align-items:center;gap:6px}
.tile .k svg{width:15px;height:15px;stroke-width:2}
.tile .v{font-size:16px;font-weight:700;margin-top:8px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.accs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acc{background:var(--card);border-radius:var(--r-card);padding:15px 15px 14px;text-align:left;box-shadow:var(--card-shadow);display:flex;flex-direction:column;gap:14px;min-width:0;transition:transform .2s var(--ease)}
.acc:active,.press:active{transform:scale(.97)}
.acc .top{display:flex;align-items:center;justify-content:space-between}
.mono{width:36px;height:36px;border-radius:12px;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-size:12px;font-weight:700;letter-spacing:-.02em;flex:none}
.acc .kind{font-size:12px;color:var(--text3);font-weight:500}
.acc .name{font-size:14px;font-weight:600;color:var(--text2)}
.acc .bal{font-size:21px;font-weight:700;letter-spacing:-.025em;margin-top:2px;white-space:nowrap}
.card{background:var(--card);border-radius:var(--r-card);box-shadow:var(--card-shadow);overflow:hidden}
.bars{padding:6px 16px}
.bar{padding:11px 0;display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:12px}
.bar+.bar{border-top:.5px solid var(--sep)}
.bar .nm{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .track{height:5px;border-radius:3px;background:var(--fill);margin-top:7px;overflow:hidden}
.bar .track i{display:block;height:100%;border-radius:3px;background:var(--ink);transform-origin:left;animation:grow .9s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}}
.bar .amt{font-size:15px;font-weight:600}
.empty{padding:26px 18px;text-align:center;color:var(--text2);font-size:15px}

/* ---------- lignes d'opérations ---------- */
.ops{background:var(--card);border-radius:var(--r-card);box-shadow:var(--card-shadow);overflow:hidden}
.op{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:12px;padding:11px 16px;width:100%;text-align:left;position:relative;transition:background-color .2s}
.op:active{background:var(--fill)}
.op+.op::before{content:"";position:absolute;top:0;left:68px;right:0;border-top:.5px solid var(--sep)}
.ic{width:40px;height:40px;border-radius:13px;background:var(--fill);display:grid;place-items:center;flex:none}
.ic svg{width:20px;height:20px}
.ic.inv{background:var(--ink);color:var(--on-ink)}
.op .l1{font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.op .l2{font-size:13px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.op .r{text-align:right}
.op .a{font-size:15.5px;font-weight:600;white-space:nowrap}
.op .a.pos::before{content:"+"}
.op .a.mut{color:var(--text2)}
.op .d{font-size:12.5px;color:var(--text3);margin-top:2px}
.month{position:sticky;top:calc(var(--safe-t) + 46px);z-index:2;display:flex;justify-content:space-between;align-items:baseline;padding:16px 4px 8px;font-size:15px;font-weight:700;background:var(--bg);text-transform:capitalize}
.month span{font-size:14px;font-weight:500;color:var(--text2);text-transform:none}
.search{display:flex;align-items:center;gap:8px;height:40px;border-radius:12px;background:var(--fill);padding:0 12px;color:var(--text2)}
.search svg{width:18px;height:18px}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:16px;color:var(--text)}
.search input::placeholder{color:var(--text3)}
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px;-webkit-overflow-scrolling:touch}
.hscroll::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:17px;background:var(--fill);font-size:14px;font-weight:600;color:var(--text2);display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:background-color .25s,color .25s,transform .2s}
.chip.on{background:var(--ink);color:var(--on-ink)}
.chip:active{transform:scale(.95)}
.chip .mono{width:22px;height:22px;border-radius:7px;font-size:8.5px}
.chip.on .mono{background:var(--on-ink);color:var(--ink)}
.filters{display:flex;flex-direction:column;gap:10px;margin:14px 0 4px}
.count{font-size:13px;color:var(--text3);margin:10px 4px 0}

/* ---------- formulaire ---------- */
.kinds{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--fill);border-radius:18px;padding:5px;position:relative}
.kinds .pill{position:absolute;top:5px;bottom:5px;left:5px;border-radius:14px;background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.08);transition:transform .45s var(--ease),width .45s var(--ease)}
.kinds button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 0 8px;font-size:11.5px;font-weight:600;color:var(--text2);transition:color .25s}
.kinds button.on{color:var(--text)}
.kinds button svg{width:20px;height:20px}
.amount{display:flex;align-items:baseline;justify-content:center;margin:26px 0 6px;font-weight:700;letter-spacing:-.04em}
.amount .sg{font-size:40px;color:var(--text3);margin-right:4px;min-width:0}
.amount input{border:0;outline:0;background:none;font-size:62px;font-weight:700;letter-spacing:0;text-align:center;width:1.6ch;min-width:.7ch;max-width:78vw;padding:0;caret-color:var(--text);font-variant-numeric:tabular-nums}
.amount input::placeholder{color:var(--text3)}
.amount .eur{font-size:40px;color:var(--text3);margin-left:6px}
.amount-sub{text-align:center;font-size:14px;color:var(--text2);min-height:20px;margin-bottom:18px}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--fill);border-radius:12px;padding:3px;margin-bottom:14px;position:relative}
.seg2 .pill{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:10px;background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.08);transition:transform .4s var(--ease)}
.seg2 button{position:relative;z-index:1;height:34px;font-size:14px;font-weight:600;color:var(--text2);transition:color .25s}
.seg2 button.on{color:var(--text)}
.fl{font-size:13px;font-weight:600;color:var(--text2);margin:16px 4px 8px;text-transform:uppercase;letter-spacing:.04em}
.group{background:var(--card);border-radius:18px;box-shadow:var(--card-shadow);overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px;width:100%;text-align:left;position:relative}
.cell+.cell::before,.cell+.sugg::before,.sugg+.cell::before{content:"";position:absolute;top:0;left:50px;right:0;border-top:.5px solid var(--sep)}
.cell>svg.i{color:var(--text2);width:21px;height:21px}
.cell .ck{font-size:16px;flex:none}
.cell .cv{margin-left:auto;font-size:16px;color:var(--text2);display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .cv svg{width:17px;height:17px;color:var(--text3)}
.cell input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:16px;text-align:right;color:var(--text);padding:14px 0}
.cell input::placeholder{color:var(--text3)}
.cell input[type=date]{-webkit-appearance:none;appearance:none;min-height:24px;display:flex;justify-content:flex-end}
.cell input[type=date]::-webkit-date-and-time-value{text-align:right}
.cell.danger{color:var(--neg)}
.cell .chev{margin-left:auto;color:var(--text3);width:17px;height:17px}
.sugg{display:flex;gap:8px;padding:2px 16px 12px 50px;overflow-x:auto;scrollbar-width:none;position:relative}
.sugg::-webkit-scrollbar{display:none}
.sugg .chip{height:30px;font-size:13px;padding:0 11px}
.primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;border-radius:18px;background:var(--ink);color:var(--on-ink);font-size:17px;font-weight:650;margin-top:22px;transition:transform .2s var(--ease),opacity .2s}
.primary:active{transform:scale(.97);opacity:.9}
.ghost{display:block;width:100%;height:50px;border-radius:16px;font-size:16px;font-weight:600;color:var(--text2);margin-top:8px}
.dates{display:flex;gap:8px;padding:0 16px 12px 50px;overflow-x:auto;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.dates .chip{flex:none}
.dates .chip{height:30px;font-size:13px;padding:0 12px}

/* ---------- profil ---------- */
.phead{display:flex;flex-direction:column;align-items:center;text-align:center;margin:8px 0 22px}
.avatar.xl{width:108px;height:108px;font-size:38px;font-weight:600;box-shadow:0 0 0 4px var(--bg),0 0 0 5px var(--sep)}
.cam{position:absolute;right:2px;bottom:2px;width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;box-shadow:0 0 0 3px var(--bg)}
.cam svg{width:17px;height:17px}
.avwrap{position:relative}
.phead .pn{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:14px}
.phead .ps{font-size:14px;color:var(--text2);margin-top:3px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats .tile{text-align:center}
.stats .tile .v{margin:0;font-size:20px}
.stats .tile .k{justify-content:center;margin-top:3px}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.th{background:var(--card);border-radius:18px;padding:10px 10px 12px;box-shadow:var(--card-shadow);display:flex;flex-direction:column;align-items:center;gap:9px;font-size:13.5px;font-weight:600;transition:box-shadow .25s,transform .2s var(--ease)}
.th:active{transform:scale(.96)}
.th.on{box-shadow:0 0 0 2px var(--ink)}
.th .pv{width:100%;aspect-ratio:1/1.25;border-radius:11px;overflow:hidden;position:relative}
.pv.l{background:#ECE8E0}.pv.d{background:#0F1710}
.pv.a{background:none}
.pv.a>.pv{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;border-radius:0}
.pv.a>.pv.d{clip-path:polygon(100% 0,100% 100%,0 100%)}
.pv i{position:absolute;left:12%;right:12%;height:9%;border-radius:4px}
.pv.l i{background:#F8F6F1;box-shadow:0 1px 2px rgba(24,35,26,.08)}.pv.d i{background:#18231A}

.pv i:nth-child(1){top:12%;height:22%;background:linear-gradient(155deg,#34492F,#2B3E28 50%,#1E2D1F);box-shadow:0 1px 3px rgba(24,35,26,.18)}.pv.d i:nth-child(1){background:linear-gradient(155deg,#3A5434,#2B3E28 50%,#1B281C);box-shadow:none}
.pv i:nth-child(2){top:42%}.pv i:nth-child(3){top:56%}.pv i:nth-child(4){top:70%;right:40%}
.th .rd{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--text3);display:grid;place-items:center;transition:all .25s}
.th.on .rd{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.th .rd svg{width:12px;height:12px;stroke-width:3;opacity:0;transition:opacity .2s}
.th.on .rd svg{opacity:1}
.switch{margin-left:auto;width:51px;height:31px;border-radius:16px;background:var(--fill2);position:relative;transition:background-color .3s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .35s var(--ease)}
.switch.on{background:var(--ink)}
html[data-theme="dark"] .switch.on::after{background:#18231A}
.switch.on::after{transform:translateX(20px)}
.foot{text-align:center;font-size:13px;color:var(--text3);margin:26px 0 0;line-height:1.5}

/* ---------- barre de menu ---------- */
#tabbar{position:fixed;z-index:20;left:0;right:0;margin:0 auto;width:max-content;bottom:calc(max(var(--safe-b),14px) + 4px);display:flex;padding:5px;border-radius:34px;background:var(--glass);-webkit-backdrop-filter:saturate(190%) blur(26px);backdrop-filter:saturate(190%) blur(26px);box-shadow:var(--glass-shadow),inset 0 0 0 .5px var(--glass-line);touch-action:none;transition:transform .45s var(--ease),opacity .3s,background-color .4s}

#tabbar .tab{width:var(--item,62px);height:54px;display:grid;place-items:center;position:relative;z-index:1;color:var(--text)}

#bubble{position:absolute;top:5px;left:0;width:62px;height:54px;border-radius:27px;background:var(--bubble);box-shadow:inset 0 0 0 .5px var(--bubble-line),inset 0 1px 0 var(--bubble-hi),0 4px 14px rgba(0,0,0,.08);will-change:transform,width,height;pointer-events:none}

/* ---------- feuilles (bottom sheets) ---------- */
#sheets{position:fixed;inset:0;z-index:40;pointer-events:none}
.sw{position:absolute;inset:0;pointer-events:auto}

.sheet{position:absolute;left:0;right:0;bottom:0;isolation:isolate;max-height:calc(100% - var(--safe-t) - 28px);display:flex;flex-direction:column;background:var(--bg);border-radius:30px 30px 0 0;transform:translateY(100%);transition:transform .5s var(--sheet-ease);box-shadow:0 -10px 40px rgba(0,0,0,.15);padding-bottom:var(--safe-b)}
html[data-theme="dark"] .sheet{background:var(--sheet-bg);box-shadow:0 0 0 .5px rgba(255,255,255,.08)}
.sw.open .sheet{transform:none}
.sheet .sh-title{touch-action:none}
.sheet .grab{flex:none;height:26px;display:grid;place-items:center;touch-action:none;cursor:grab}
.sheet .grab::after{content:"";width:38px;height:5px;border-radius:3px;background:var(--fill2)}
.sheet .sb{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 18px 22px;overscroll-behavior:contain}
.sh-title{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:4px 2px 16px;display:flex;align-items:center;justify-content:space-between}

.det{display:flex;flex-direction:column;align-items:center;text-align:center;margin:6px 0 20px}

.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.act{background:var(--card);border-radius:16px;box-shadow:var(--card-shadow);display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0 12px;font-size:13px;font-weight:600}

.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px}

.acchead{display:flex;flex-direction:column;align-items:center;margin:2px 0 18px}

.btn-danger{background:var(--neg)!important;color:#fff!important}

/* ---------- années, mois ---------- */
.ypill{display:inline-flex;align-items:center;gap:2px;height:30px;padding:0 8px 0 12px;border-radius:15px;background:var(--fill);font-size:14px;font-weight:650;flex:none}

.sub{font-size:14.5px;color:var(--text2);margin:-6px 4px 14px;line-height:1.45}

/* ---------- analyse ---------- */
.sum4{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.ctr .c2{font-size:23px;font-weight:700;letter-spacing:-.02em;margin-top:3px;white-space:nowrap}.ctr .c2.long{font-size:18px}.ctr .c2.xlong{font-size:15px}

.legend{padding:2px 16px 6px}

.lg+.lg::before{content:"";position:absolute;top:0;left:22px;right:0;border-top:.5px solid var(--sep)}

.lg .am{font-weight:600;min-width:86px;text-align:right}
.legend.sel .lg:not(.on){opacity:.38}
.mbars{display:flex;align-items:flex-end;gap:3px;height:176px;padding:20px 10px 0}
.mb{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end;transition:opacity .25s;min-width:0}
.mb .bb{display:flex;align-items:flex-end;gap:2px;height:100%;width:100%;justify-content:center}
.mb .bb i{width:40%;max-width:10px;border-radius:3px 3px 1px 1px;background:var(--ink);min-height:2px;transform-origin:bottom;animation:growy .8s var(--ease) both}
.mb .bb i.d{background:var(--text3)}
@keyframes growy{from{transform:scaleY(0)}}
.mb span{font-size:11.5px;font-weight:650;color:var(--text3)}
.mb.on span{color:var(--text)}
.mbars.sel .mb:not(.on){opacity:.32}
.mb.fut{opacity:.2}
.still .mb .bb i,.still .bar .track i{animation:none}
.keys{display:flex;gap:16px;padding:12px 16px 14px;font-size:13px;color:var(--text2)}
.keys b{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--ink);margin-right:6px;vertical-align:-1px}
.keys b.d{background:var(--text3)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tw::-webkit-scrollbar{display:none}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px;white-space:nowrap}
.tbl th{font-size:11px;font-weight:650;color:var(--text2);text-transform:uppercase;letter-spacing:.03em;text-align:right;padding:13px 8px 9px}
.tbl td{text-align:right;padding:10px 8px;border-top:.5px solid var(--sep);font-variant-numeric:tabular-nums}
.tbl th:first-child,.tbl td:first-child{text-align:left;position:sticky;left:0;background:var(--card);padding-left:16px;z-index:1;max-width:136px;overflow:hidden;text-overflow:ellipsis;font-weight:550}
.tbl th:first-child{font-weight:650}

.tbl tr.tot td{font-weight:700;border-top:1px solid var(--text3)}
.tbl td.z{color:var(--text3)}
.tbl tr.hl td,.tbl .hl{box-shadow:inset 0 0 0 999px var(--fill)}
.tbl tr[data-am]{cursor:pointer}
/* placements */
.plc{padding-bottom:4px}
.pl-head{padding:18px 16px 8px}
.pl-k{font-size:14px;color:var(--text2);font-weight:500}
.pl-v{font-size:32px;font-weight:700;letter-spacing:-.03em;margin-top:2px}
.pl-s{font-size:13.5px;color:var(--text2);margin-top:3px}
.pl-row{padding:10px 16px 6px}

.pl-n{font-size:15px;font-weight:550}
.pl-a{font-size:15px;font-weight:650}

.pl-t i{position:absolute;top:0;bottom:0;border-radius:4px;animation:grow .9s var(--ease) both}
.pl-t i.up{left:50%;background:var(--ink);transform-origin:left}
.pl-t i.down{right:50%;background:var(--text3);transform-origin:right}

/* accueil : carte du mois */
.month-card{display:block;width:100%;text-align:left;padding:16px 16px 14px;transition:transform .2s var(--ease)}
.mc-row{display:flex;justify-content:space-between;gap:12px}

.mc-v{font-size:24px;font-weight:700;letter-spacing:-.025em;margin-top:4px}
.mc-track{height:6px;border-radius:3px;background:var(--fill);margin:14px 0 10px;overflow:hidden}

.ghost.danger{color:var(--neg)}
.code{display:flex;justify-content:center;gap:8px;margin:6px 0 18px}
.code span{width:42px;height:54px;border-radius:12px;background:var(--card);box-shadow:var(--card-shadow);display:grid;place-items:center;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.codein{display:block;width:100%;height:56px;border-radius:16px;border:0;outline:0;background:var(--fill);text-align:center;font-size:26px;font-weight:700;letter-spacing:.4em;padding-left:.4em;color:var(--text);font-variant-numeric:tabular-nums}

.primary:disabled{opacity:.3;transform:none}

/* ---------- analyse : détail & placements ---------- */
.lgn{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lgt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lic{display:inline-grid;place-items:center;flex:none;color:var(--text2)}
.lic svg{width:16px;height:16px}
.lg .am{display:flex;align-items:center;justify-content:flex-end;gap:3px}
.lg .am svg{width:14px;height:14px;color:var(--text3)}
.lg.small{font-size:14px;padding:9px 0}
.mbars.mini{height:120px;padding:16px 10px 12px}
.mbars.mini .mb .bb i{width:55%;max-width:14px}
.mbars.mini .mb.on span{color:var(--text)}
.mbars.mini .mb.on .bb i{box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--text3)}
.pl3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.pl3>div{background:var(--fill);border-radius:12px;padding:9px 10px}
.pl3 span{display:block;font-size:12px;color:var(--text2);font-weight:500}

.plchart{position:relative;height:150px;margin:8px 16px 0}
.plchart svg{position:absolute;left:0;right:0;top:0;width:100%;height:130px;overflow:visible}
.pll{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.pla{fill:var(--fill2)}
.plz{stroke:var(--text3);stroke-width:1;stroke-dasharray:3 4}
.pld{position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 2.5px var(--card)}
.pld.on{width:12px;height:12px;margin:-6px 0 0 -6px}
.plm{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(12,1fr);text-align:center;font-size:11px;font-weight:650;color:var(--text3)}
.plm .fut{opacity:.35}.plm .on{color:var(--text)}
.plcards{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.plcard{display:block;width:100%;text-align:left;background:var(--card);border-radius:20px;box-shadow:var(--card-shadow);padding:14px 16px;transition:transform .2s var(--ease)}
.pc-top{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center}

/* ---------- roue de date ---------- */
.dp-prev{text-align:center;font-size:16px;font-weight:600;margin:-2px 0 12px}
.wheels{position:relative;display:grid;grid-template-columns:.8fr 1.5fr 1fr;gap:4px;height:200px;margin-bottom:6px;-webkit-mask-image:linear-gradient(transparent,#000 28%,#000 72%,transparent);mask-image:linear-gradient(transparent,#000 28%,#000 72%,transparent)}
.wband{position:absolute;left:0;right:0;top:80px;height:40px;border-radius:12px;background:var(--fill2);pointer-events:none}
.wheel{position:relative;height:200px;min-width:0}
.wl{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;padding:80px 0;scrollbar-width:none;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}

/* ---------- logo en fond ---------- */
.wmw{position:sticky;top:0;height:100vh;height:100dvh;margin-bottom:-100vh;margin-bottom:-100dvh;display:grid;place-items:center;pointer-events:none;z-index:0;overflow:hidden}
.wm{width:min(78vw,40vh);height:auto;opacity:var(--wm-o);filter:blur(7px);transform:translateY(-2vh)}

.wm circle{fill:var(--wm)}
.page>.content,.push-sc>.content{position:relative;z-index:1}
.pbar{position:sticky}
/* ---------- accueil : en-tête ---------- */
.hh-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 2px;min-height:40px}
.hh-top .eyebrow{margin:0}
.hh-r{display:flex;align-items:center;gap:10px}
.hh-title{margin:0 0 18px}
.ysw{display:flex;align-items:center;height:36px;border-radius:18px;background:var(--fill);padding:0 2px}

/* ---------- transition d'année ---------- */
.yt{position:fixed;inset:0;z-index:90;background:var(--bg);color:var(--text);display:grid;place-items:center;overflow:hidden}
.yt-in{display:grid;place-items:center}

/* ---------- page compte ---------- */
.cal-f{margin:14px -18px 0;padding:0 18px}
.cal-card{margin-top:14px;background:var(--card);border-radius:var(--r-card);padding:14px 10px 12px;box-shadow:var(--card-shadow);overflow:hidden}
.cal-h{display:flex;align-items:center;gap:8px;padding:0 4px 10px}.cal-h b{flex:1;font-size:19px;font-weight:700;letter-spacing:-.01em}
.cal-nv{width:36px;height:36px;border-radius:18px;background:var(--fill);display:grid;place-items:center;order:3}.cal-nv .i{transform:rotate(180deg);width:16px;height:16px}.cal-nv.nx{order:4}.cal-nv.nx .i{transform:none}
.cal-today{order:2;height:32px;padding:0 12px;border-radius:16px;background:var(--fill);font-size:13px;font-weight:600}
.cal-wd,.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}.cal-wd span{text-align:center;font-size:11.5px;font-weight:600;color:var(--text3);padding-bottom:6px}
.cal-g{touch-action:pan-y}.cal-g.in-r{animation:calR .34s var(--sheet-ease)}.cal-g.in-l{animation:calL .34s var(--sheet-ease)}
@keyframes calR{from{transform:translateX(40px);opacity:0}}@keyframes calL{from{transform:translateX(-40px);opacity:0}}
.cal-d{min-height:54px;border-radius:13px;display:flex;flex-direction:column;align-items:center;padding:5px 0 3px;gap:3px;transition:background-color .2s}

.cal-d.past .n{color:var(--text2)}.cal-d.td .n{background:var(--fill2);color:var(--text)}.cal-d.sel{background:var(--fill)}.cal-d.sel .n{background:var(--ink);color:var(--on-ink)}
.cal-d .dots{display:flex;gap:3px;height:5px}.cal-d .dots i,.cal-lg i{width:5px;height:5px;border-radius:50%;display:inline-block}

.primary.alt{background:var(--fill2);color:var(--text)}
.acclist{display:flex;flex-direction:column;gap:10px}
.acccard{display:grid;grid-template-columns:40px 1fr auto 16px;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border-radius:20px;box-shadow:var(--card-shadow);padding:13px 14px;transition:transform .2s var(--ease)}

.ac-n{font-size:16px;font-weight:650;min-width:0}

/* ---------- frais de tenue de compte ---------- */
html[data-theme="light"]{--warn:#8B6530;--warn-bg:rgba(139,101,48,.12);--warn-line:rgba(139,101,48,.55)}
html[data-theme="dark"]{--warn:#D2A86A;--warn-bg:rgba(196,154,94,.14);--warn-line:rgba(196,154,94,.55)}
.fee-card{display:grid;grid-template-columns:40px 1fr auto 16px;align-items:center;gap:12px;width:100%;text-align:left;margin-top:12px;background:var(--card);border-radius:20px;box-shadow:var(--card-shadow);padding:13px 14px;transition:transform .2s var(--ease)}
.fee-card.warn{box-shadow:inset 0 0 0 1.5px var(--warn-line),var(--card-shadow)}
.fc-n{font-size:15.5px;font-weight:650;min-width:0}

.fc-badge{display:flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:14px;background:var(--warn-bg);color:var(--warn);font-size:13.5px;font-weight:700;white-space:nowrap}

.fc-ok{width:26px;height:26px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--text2)}
.fc-ok svg{width:14px;height:14px;stroke-width:2.6}
.fee-card>svg{width:16px;height:16px;color:var(--text3)}
.tile.warn{background:var(--warn-bg);box-shadow:inset 0 0 0 1.5px var(--warn-line)}
.tile.warn .v,.tile.warn .k{color:var(--warn)}
.fee-alert{display:flex;gap:12px;align-items:flex-start;margin-top:12px;padding:13px 14px;border-radius:16px;background:var(--warn-bg);color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn-line)}
.fee-alert svg{width:22px;height:22px;flex:none;stroke-width:2}
.fee-alert b{display:block;font-size:15px}
.fee-alert span{display:block;font-size:13.5px;margin-top:2px;opacity:.9}
.fee-alert.ok{background:var(--fill);color:var(--text);box-shadow:none}
.fee-list{display:flex;flex-direction:column;gap:8px}
.fee-row{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:var(--card);box-shadow:var(--card-shadow)}
.fr-ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--text2)}
.fr-ic svg{width:15px;height:15px;stroke-width:2.5}
.fr-t b,.fr-r b{display:block;font-size:15px;font-weight:600}
.fr-t small,.fr-r small{display:block;font-size:12.5px;color:var(--text2);margin-top:2px}
.fr-r{text-align:right}
.fee-row.due{background:var(--warn-bg);box-shadow:inset 0 0 0 1.5px var(--warn-line)}
.fee-row.due .fr-ic{background:var(--warn);color:var(--bg)}
.fee-row.due .fr-r small{color:var(--warn);font-weight:700}
.fr-add{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:6px;height:36px;border-radius:12px;background:var(--warn);color:var(--bg);font-size:14px;font-weight:650;margin-top:4px}
.fr-add svg{width:15px;height:15px;stroke-width:2.6}

/* ---------- onglets des comptes ---------- */
.tmono{display:grid;place-items:center;min-width:25px;height:22px;padding:0 3px;border:1.8px solid currentColor;border-radius:7px;font-size:8.5px;font-weight:800;letter-spacing:-.02em;line-height:1;will-change:transform,opacity}
#tabbar.dense .tab svg{width:22px;height:22px}
#tabbar.scroll{max-width:calc(100% - 20px);overflow-x:auto;touch-action:pan-x;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#tabbar.scroll::-webkit-scrollbar{display:none}
.accpage .content{padding-top:4px}
.accpage .acc-sec{margin-top:30px}
.accpage .anP{margin-top:0;padding-top:2px;padding-bottom:2px}

/* ---------- suppression ---------- */
.del-row{min-height:62px}
.dl-t{display:flex;flex-direction:column;min-width:0;padding:10px 0}
.dl-t b{font-size:16px;font-weight:550}
.dl-t small{font-size:13px;color:var(--text2);margin-top:2px}
.cell.danger .dl-t small{color:inherit;opacity:.75}
.ghost svg{width:18px;height:18px;vertical-align:-3px;margin-right:6px}

/* ---------- factures ---------- */
.clip{display:inline-grid;vertical-align:-2px;margin-right:5px;color:var(--text2)}
.clip svg{width:14px;height:14px;stroke-width:2.2}
#oView{margin:0 0 12px}
.docgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.doc{display:flex;flex-direction:column;text-align:left;background:var(--card);border-radius:18px;box-shadow:var(--card-shadow);overflow:hidden;transition:transform .2s var(--ease);min-width:0}
.dthumb{display:grid;place-items:center;height:118px;background:var(--fill);overflow:hidden;color:var(--text2)}
.dthumb img{width:100%;height:100%;object-fit:cover;display:block}
.dthumb>svg{width:26px;height:26px}
.dpdf{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text2)}
.dpdf svg{width:30px;height:30px}
.dpdf b{font-size:11px;letter-spacing:.06em}
.dpdf.big{padding:46px 0}.dpdf.big svg{width:48px;height:48px}.dpdf.big span{font-size:13px}
.dmeta{display:flex;flex-direction:column;gap:2px;padding:10px 12px 12px;min-width:0}
.dmeta b{font-size:14.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dmeta small{font-size:12.5px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dkind{display:inline-flex;align-items:center;gap:3px;font-style:normal;font-size:11px;font-weight:700;color:var(--gold-t);background:var(--gold-bg);padding:2px 7px;border-radius:7px;margin-bottom:3px;align-self:flex-start}.dkind .i{width:11px;height:11px}
.dfree{display:flex;align-items:center;gap:4px;color:var(--warn)!important}

.docrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.doc.add .dthumb{background:none;border:1.5px dashed var(--text3);border-radius:14px;margin:8px 8px 0;height:86px}
.dview{background:var(--card);border-radius:18px;box-shadow:var(--card-shadow);overflow:hidden;min-height:120px;display:grid;place-items:center}
.dview img{display:block;width:100%;height:auto;max-height:62vh;object-fit:contain;background:#fff}

/* ---------- aperçu & visionneuse ---------- */
.dthumb{position:relative}
.dbadge{position:absolute;right:8px;bottom:8px;font-style:normal;font-size:10px;font-weight:800;letter-spacing:.05em;padding:3px 6px;border-radius:6px;background:rgba(0,0,0,.65);color:#fff}
.dview{position:relative;cursor:zoom-in}
.dpages{display:flex;flex-direction:column;gap:6px;max-height:64vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#E4DED2;padding:6px;width:100%}
.dpages img{display:block;width:100%;height:auto;background:#fff;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.dpn{position:absolute;left:10px;top:10px;font-size:12px;font-weight:700;padding:4px 8px;border-radius:8px;background:rgba(0,0,0,.6);color:#fff}
.dzoom{position:absolute;right:10px;bottom:10px;display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:650;padding:6px 10px;border-radius:10px;background:rgba(0,0,0,.6);color:#fff;pointer-events:none}
.dzoom svg{width:14px;height:14px}
.viewer{position:fixed;inset:0;z-index:95;background:#000;display:flex;flex-direction:column;opacity:0;transition:opacity .3s}
.viewer.open{opacity:1}
.vw-bar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(var(--safe-t) + 8px) 14px 8px;color:#fff}
.vw-t{font-size:15px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vw-x{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;flex:none}
.vw-x svg{width:18px;height:18px;stroke-width:2.4}
.vw-sc{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;padding-bottom:var(--safe-b)}
.vw-in{width:100%;display:flex;flex-direction:column;gap:8px;padding:4px 0 24px}
.vw-in img{display:block;width:100%;height:auto;background:#fff;user-select:none;-webkit-user-select:none}
.vw-hint{position:absolute;left:50%;bottom:calc(var(--safe-b) + 20px);transform:translateX(-50%);font-size:13px;color:#fff;background:rgba(255,255,255,.14);padding:8px 14px;border-radius:14px;transition:opacity .5s;pointer-events:none;white-space:nowrap}
.vw-hint.gone{opacity:0}

/* ---------- import de factures ---------- */
.impbtn{display:flex;align-items:center;gap:6px;height:36px;padding:0 13px 0 10px;border-radius:18px;background:var(--fill);font-size:14.5px;font-weight:650;margin-bottom:6px;flex:none}
.impbtn svg{width:18px;height:18px}
.scan{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 6px 4px}
.scan-ic{width:62px;height:62px;border-radius:20px;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;margin-bottom:14px;animation:pulse 1.4s ease-in-out infinite}
.scan-ic svg{width:30px;height:30px}
@keyframes pulse{50%{transform:scale(.92);opacity:.75}}
.scan b{font-size:18px}
.scan span{font-size:14px;color:var(--text2);margin-top:4px;min-height:18px}
.scan-bar{width:100%;height:6px;border-radius:3px;background:var(--fill);margin:18px 0 4px;overflow:hidden}
.scan-bar i{display:block;height:100%;width:6%;border-radius:3px;background:var(--ink);transition:width .3s}
.rv-top{display:flex;align-items:center;gap:12px;margin:0 2px 14px}

.rv-top div{min-width:0}
.rv-top b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv-top span{display:block;font-size:13px;color:var(--text2);margin-top:2px}
.auto{display:inline-flex;align-items:center;gap:3px;font-style:normal;font-size:11px;font-weight:700;padding:3px 7px;border-radius:8px;background:var(--fill2);color:var(--text2);flex:none}
.auto svg{width:11px!important;height:11px!important;color:inherit!important}
.auto.miss{background:var(--warn-bg);color:var(--warn)}
.rvm{overflow:hidden}
.rv-opt{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 16px;position:relative}
.rv-opt+.rv-opt::before{content:"";position:absolute;top:0;left:50px;right:0;border-top:.5px solid var(--sep)}
.rv-opt .rd{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--text3);display:grid;place-items:center;transition:all .2s}
.rv-opt .rd svg{width:12px;height:12px;stroke-width:3;opacity:0}
.rv-opt.on .rd{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.rv-opt.on .rd svg{opacity:1}
.rv-o{min-width:0}
.rv-o b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv-o small{display:block;font-size:12.5px;color:var(--text2);margin-top:2px}
.rv-opt>b{font-size:15px}
.rv-opt>svg{width:18px;height:18px;color:var(--text2)}

/* ---------- thème clair vraiment clair ---------- */
html[data-theme="light"] .mono{background:#E4DED2;color:#18231A;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.06)}
html[data-theme="light"] .chip.on .mono{background:#F2EFE9;color:#18231A}
html[data-theme="light"] .tile.inv{background:linear-gradient(155deg,#F8F6F1,#ECE8E0);color:var(--text);box-shadow:var(--card-shadow),inset 0 0 0 1.5px rgba(10,10,11,.12)}
html[data-theme="light"] .tile.inv .k{opacity:1;color:var(--text2)}
html[data-theme="light"] .ic.inv{background:#E4DED2;color:#18231A}
/* ---------- premier lancement ---------- */
.welcome{display:flex;flex-direction:column;align-items:center;text-align:center;background:var(--card);border-radius:26px;box-shadow:var(--card-shadow);padding:34px 22px 18px;margin-top:6px}
.welcome.small{padding:26px 20px 16px}
.wl-logo{width:110px;height:auto;margin-bottom:22px;overflow:visible}
.wl-logo path{fill:none;stroke:var(--text);stroke-width:30;stroke-linecap:round;stroke-linejoin:round}
.wl-logo circle{fill:var(--text)}
.welcome b{font-size:19px;letter-spacing:-.01em}
.welcome span{font-size:14.5px;color:var(--text2);margin-top:6px;line-height:1.45}
.welcome .ghost{font-size:15px}
/* ---------- import ---------- */
.ip-list{max-height:46vh;overflow-y:auto}
.ip-row{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 16px;position:relative}
.ip-row+.ip-row::before{content:"";position:absolute;top:0;left:50px;right:0;border-top:.5px solid var(--sep)}
.ip-row .rd{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--text3);display:grid;place-items:center;transition:all .2s}
.ip-row .rd svg{width:12px;height:12px;stroke-width:3;opacity:0}
.ip-row.on .rd{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.ip-row.on .rd svg{opacity:1}
.ip-row:not(.on){opacity:.55}
.ip-row>b{font-size:14.5px}
.paste{display:block;width:100%;min-height:180px;border:0;outline:0;border-radius:16px;background:var(--card);box-shadow:var(--card-shadow);padding:14px;font:14px/1.4 ui-monospace,Menlo,monospace;color:var(--text);resize:vertical}
.primary:disabled{opacity:.35}
/* ---------- phrase d'accroche ---------- */
#splash .tagline{position:absolute;left:0;right:0;top:calc(50% + 24px);text-align:center;font-size:15px;font-weight:500;letter-spacing:.01em;color:rgba(242,239,233,.62);opacity:0}

/* ---------- graphique accueil ---------- */
.cgrid{stroke:var(--hero-fill);stroke-width:1}
.cbase{stroke:var(--hero-2);stroke-width:1;stroke-dasharray:3 5;opacity:.6}
.cticks{position:absolute;left:0;right:0;bottom:3px;height:14px;pointer-events:none}
.cticks span{position:absolute;transform:translateX(-50%);font-size:10.5px;font-weight:600;color:var(--hero-2);text-transform:capitalize}
/* ---------- analyse détaillée ---------- */
.sum4 .tile{text-align:left;transition:transform .2s var(--ease),box-shadow .25s}
.sum4 .tile.focus{box-shadow:var(--card-shadow),0 0 0 2px var(--ink)}
.sum4 .tile.inv.focus{box-shadow:var(--card-shadow),0 0 0 2px var(--text2)}
.lnk{font:inherit;color:var(--text);font-weight:650;text-decoration:underline;text-underline-offset:2px}
.rings{display:flex;justify-content:center;gap:18px;font-size:13px;color:var(--text2);padding:0 16px 6px}
.rings span{display:flex;align-items:center;gap:6px}
.rings i{width:14px;height:14px;border-radius:50%;border:3.5px solid var(--text);display:inline-block}
.rings i.in{width:10px;height:10px;border-width:2.5px;border-color:var(--text2)}
.mchart{position:relative;height:196px;padding:14px 10px 0}
.mchart svg{display:block;width:100%;height:170px;overflow:visible}
.mbr{fill:var(--ink);transform-box:fill-box;transform-origin:bottom;animation:growy .8s var(--ease) both}
.mbr.d{fill:var(--text3)}.mbr.neg{fill:var(--text3);transform-origin:top}
.still .mbr{animation:none}
.mz{stroke:var(--text3);stroke-width:1;stroke-dasharray:2 4}

.au-foot{margin-top:auto;padding-top:28px;text-align:center;font-size:12.5px;color:var(--text3)}
.spin{width:18px;height:18px;border-radius:50%;border:2.4px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.info{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--text3);display:grid;place-items:center;font:italic 700 13px Georgia,serif;color:var(--text2);margin-left:2px;flex:none}
.sum4 .tile.wide{grid-column:1/-1}
.fc-sum{font-size:14px;font-weight:700;color:var(--text2)}

/* ---------- captures ---------- */
.impbtns{display:flex;gap:8px;flex:none}
.impbtns .impbtn{padding:0 11px 0 9px}
.shotbtn{display:grid;grid-template-columns:22px 1fr 16px;align-items:center;gap:12px;width:100%;text-align:left;margin-top:10px;background:var(--card);border-radius:18px;box-shadow:var(--card-shadow);padding:12px 14px;transition:transform .2s var(--ease)}
.shotbtn>svg:first-child{width:22px;height:22px}
.shotbtn b{display:block;font-size:15px}
.shotbtn small{display:block;font-size:12.5px;color:var(--text2);margin-top:1px}
.shotbtn>svg:last-child{width:16px;height:16px;color:var(--text3)}

/* ---------- toast ---------- */
#toast{position:fixed;z-index:60;left:50%;top:calc(var(--safe-t) + 10px);transform:translate(-50%,-140%);display:flex;align-items:center;gap:9px;max-width:calc(100% - 32px);padding:11px 18px 11px 13px;border-radius:24px;background:var(--glass);-webkit-backdrop-filter:saturate(190%) blur(24px);backdrop-filter:saturate(190%) blur(24px);box-shadow:var(--glass-shadow),inset 0 0 0 .5px var(--glass-line);font-size:14.5px;font-weight:600;transition:transform .55s var(--ease),opacity .3s;opacity:0;pointer-events:none}
#toast.show{transform:translate(-50%,0);opacity:1}
#toast .tk{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;flex:none}
#toast .tk svg{width:14px;height:14px;stroke-width:3}

/* ---------- écran d'ouverture ---------- */
.lg-r{stroke-width:13px!important;fill:none}
#spRays{opacity:0;transform-box:view-box;transform-origin:405px 180px}
.yt-r{fill:none;stroke:var(--text);stroke-linecap:round}
#splash{position:fixed;inset:0;z-index:100;background:#18231A;color:#F2EFE9;display:grid;place-items:center;overflow:hidden}
#splash .inner{display:flex;align-items:center;gap:10px;transform-origin:0 0;position:relative;top:-22px}
#splash svg{width:84px;height:55px;overflow:visible}
#splash path{fill:none;stroke:#F2EFE9;stroke-width:26;stroke-linecap:round;stroke-linejoin:round}
#splash #spRays{stroke:#C99B5B}#splash circle{fill:#C99B5B;transform-box:fill-box;transform-origin:center;transform:scale(0)}
#splash .word{font-size:46px;font-weight:700;letter-spacing:-.035em;display:flex;margin-left:6px}
#splash .word span{display:inline-block;opacity:0}
#splash .skip{position:absolute;inset:0}
html.booting #app{opacity:0}

.nf-off{opacity:.45;pointer-events:none}.nf-ch{margin:0 -18px;padding:0 18px}
.ob-themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:4px}
</style>

function sheet(html,opts={}){

function drawChart(){
  const el=$("chart");if(!el)return;
  const raw=series();
  // on lisse un peu (un point tous les quelques jours) pour une courbe propre
  const step=Math.max(1,Math.ceil(raw.length/90)),pts=[];
  for(let i=0;i<raw.length;i+=step)pts.push(raw[Math.min(raw.length-1,i+step-1)]);
  if(pts[pts.length-1]!==raw[raw.length-1])pts.push(raw[raw.length-1]);
  pts.unshift(raw[0]);
  const W=400,H=132,padT=14,padB=22,padR=26,padL=14,PW=W-padR;
  const vals=pts.map(p=>p[1]);let mn=Math.min(...vals),mx=Math.max(...vals);if(mx-mn<1){mx+=1;mn-=1}const pad=(mx-mn)*.08;mx+=pad;mn-=pad;
  const X=i=>pts.length<2?PW:padL+i/(pts.length-1)*(PW-padL),Y=v=>padT+(1-(v-mn)/(mx-mn))*(H-padT-padB);
  // courbe monotone (pas de rebonds artificiels)
  const P=pts.map((p,i)=>[X(i),Y(p[1])]),n=P.length,dx=[],sl=[],tg=[];
  for(let i=0;i<n-1;i++){dx[i]=P[i+1][0]-P[i][0];sl[i]=(P[i+1][1]-P[i][1])/(dx[i]||1)}
  for(let i=0;i<n;i++)tg[i]=i===0?sl[0]:i===n-1?sl[n-2]:(sl[i-1]*sl[i]<=0?0:(sl[i-1]+sl[i])/2);
  for(let i=0;i<n-1;i++){if(sl[i]===0){tg[i]=tg[i+1]=0;continue}const a=tg[i]/sl[i],b=tg[i+1]/sl[i],h=a*a+b*b;if(h>9){const t=3/Math.sqrt(h);tg[i]=t*a*sl[i];tg[i+1]=t*b*sl[i]}}
  let d=`M${P[0][0].toFixed(1)} ${P[0][1].toFixed(1)}`;
  for(let i=0;i<n-1;i++){const h=dx[i]/3;d+=`C${(P[i][0]+h).toFixed(1)} ${(P[i][1]+tg[i]*h).toFixed(1)} ${(P[i+1][0]-h).toFixed(1)} ${(P[i+1][1]-tg[i+1]*h).toFixed(1)} ${P[i+1][0].toFixed(1)} ${P[i+1][1].toFixed(1)}`}
  const y0=Y(pts[0][1]);
  // repères des mois
  const first=pd(raw[0][0]),last=pd(raw[raw.length-1][0]),span=Math.max(1,(last-first)/864e5),ticks=[];
  for(let m=new Date(first.getFullYear(),first.getMonth()+(first.getDate()>1?1:0),1);m<=last;m.setMonth(m.getMonth()+1)){const f=((m-first)/864e5)/span;ticks.push([padL+f*(PW-padL),span>120?MONTHS[m.getMonth()][0].toUpperCase():capF(MONTHS[m.getMonth()].slice(0,4).replace(/\.$/,""))])}
  el.setAttribute("role","img");el.setAttribute("aria-label",`Évolution de l'argent total : de ${eur(pts[0][1])} à ${eur(pts[pts.length-1][1])}`);
  el.innerHTML=`<svg aria-hidden="true" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--hero-line);stop-opacity:.26"/><stop offset=".75" style="stop-color:var(--hero-line);stop-opacity:.04"/><stop offset="1" style="stop-color:var(--hero-line);stop-opacity:0"/></linearGradient></defs>
    ${ticks.map(([x])=>`<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${padT}" y2="${H-padB}" class="cgrid" vector-effect="non-scaling-stroke"/>`).join("")}
    <line x1="0" x2="${W}" y1="${y0.toFixed(1)}" y2="${y0.toFixed(1)}" class="cbase" vector-effect="non-scaling-stroke"/>
    <path d="${d}L${PW} ${H-padB}L${padL} ${H-padB}Z" fill="url(#cg)"/><path id="cLine" d="${d}" fill="none" style="stroke:var(--hero-line)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>
    <div class="cticks">${ticks.map(([x,l])=>`<span style="left:${(x/W*100).toFixed(2)}%">${l}</span>`).join("")}</div><div class="cursor" id="cCur"></div><div class="dot" id="cDot"></div>`;
  const line=$("cLine");
  if(!reduced){const sv=el.querySelector("svg");sv.style.clipPath="inset(0 100% 0 0)";sv.getBoundingClientRect();sv.style.transition="clip-path 1.1s cubic-bezier(.65,0,.35,1)";sv.style.clipPath="inset(0 0 0 0)"}
  const dot=$("cDot"),cc=$("cCur");
  const place=i=>{dot.style.left=(X(i)/W*100)+"%";dot.style.top=(Y(pts[i][1])/H*100)+"%";cc.style.left=(X(i)/W*100)+"%"};
  place(pts.length-1);
  const f0=pts[0][1],diff=pts[pts.length-1][1]-f0;
  const lab=S.year!==curYear()?"sur l'année "+S.year:{"1M":"sur 30 jours","3M":"sur 3 mois","A":"depuis le 1er janvier"}[range];
  const setDelta=()=>{$("hDelta").innerHTML=`<b class="num">${eur(diff,true)}</b> ${lab}`};setDelta();
  const big=$("hBig");const showVal=v=>{const s=splitCts(v);big.innerHTML=`${s.neg?"−":""}${s.int}<span class="cts">${s.cts} €</span>`};
  let on=false;
  const at=e=>{const r=el.getBoundingClientRect();const f=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));const i=Math.round(f*(pts.length-1));place(i);showVal(pts[i][1]);$("hLbl").textContent=capF(longDate(pts[i][0]));$("hDelta").innerHTML=`<b class="num">${eur(pts[i][1]-f0,true)}</b> ${lab}`};
  el.onpointerdown=e=>{on=true;el.classList.add("scrub");try{el.setPointerCapture(e.pointerId)}catch(_){}at(e)};
  el.onpointermove=e=>{if(on)at(e)};
  el.onpointerup=el.onpointercancel=()=>{on=false;el.classList.remove("scrub");place(pts.length-1);showVal(totalBalance());$("hLbl").textContent="Argent total";setDelta()};
}

let ytBusy=false;
function yearTransition(y,after){
  if(ytBusy)return;
  if(y===S.year){after&&after();return}
  if(reduced){setYear(y,true);toast("Année "+y);after&&after();return}
  ytBusy=true;
  const ov=document.createElement("div");ov.className="yt";
  ov.innerHTML=`<div class="yt-in"><svg class="yt-logo" viewBox="80 120 380 250"><path class="yt-p" d="M369 217 L293 295 Q278 310 262 296 L219 258 Q203 244 188 260 L110 345"/><circle class="yt-d" cx="405" cy="180" r="24"/><path class="lg-r yt-r" d="M445 180h10M433.3 208.3l7.1 7.1M405 220v10M365 180h-10M376.7 151.7l-7.1-7.1M405 140v-10M433.3 151.7l7.1-7.1"/></svg></div><div class="yt-y num">${y}</div><button class="skip" aria-label="Passer"></button>`;
  document.body.appendChild(ov);
  const yEl=ov.querySelector(".yt-y"),path=ov.querySelector(".yt-p"),dot=ov.querySelector(".yt-d"),logo=ov.querySelector(".yt-logo"),appEl=$("app");
  const L=path.getTotalLength();path.style.strokeDasharray=L;path.style.strokeDashoffset=L;
  const A=(el,k,o)=>el.animate(k,Object.assign({fill:"both"},o));
  // 1. l'année apparaît
  A(ov,[{opacity:0},{opacity:1}],{duration:260,easing:"ease-out"});
  A(yEl,[{opacity:0,transform:"translate(-50%,-50%) scale(.82)",filter:"blur(10px)"},{opacity:1,transform:"translate(-50%,-50%) scale(1)",filter:"blur(0)"}],{duration:520,delay:120,easing:"cubic-bezier(.22,1,.36,1)"});
  // 2. elle se resserre dans le point du logo
  const r=dot.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  const dx=cx-innerWidth/2,dy=cy-innerHeight/2;
  setTimeout(()=>{
    A(yEl,[{opacity:1,transform:"translate(-50%,-50%) scale(1)"},{opacity:0,transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(.08)`}],{duration:460,easing:"cubic-bezier(.55,0,.7,.2)"});
    A(dot,[{transform:"scale(0)"},{transform:"scale(1.35)",offset:.6},{transform:"scale(1)"}],{duration:480,delay:300,easing:"cubic-bezier(.34,1.56,.64,1)"});
  },900);
  // 3. on change d'année pendant que l'écran est couvert
  setTimeout(()=>{setYear(y,true)},1150);
  // 4. le logo se dessine à l'envers : il descend, remonte un peu, redescend
  setTimeout(()=>A(path,[{strokeDashoffset:L},{strokeDashoffset:0}],{duration:820,easing:"cubic-bezier(.65,0,.35,1)"}),1350);
  // 5. une fenêtre s'ouvre au bout du trait et l'appli réapparaît
  let revealed=false;
  const reveal=()=>{
    if(revealed)return;revealed=true;
    const lr=logo.getBoundingClientRect(),sx=lr.width/380,ex=lr.left+(102-80)*sx,ey=lr.top+(348-120)*sx;
    const far=Math.hypot(Math.max(ex,innerWidth-ex),Math.max(ey,innerHeight-ey));
    A(logo,[{opacity:1,transform:"scale(1)"},{opacity:0,transform:"scale(1.25)"}],{duration:520,easing:"ease-in"});
    appEl.style.transformOrigin=ex+"px "+ey+"px";
    const t0=performance.now(),D=760;
    const step=now=>{
      const t=Math.min(1,(now-t0)/D),e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
      const R=far*1.05*e;
      const m=`radial-gradient(circle at ${ex}px ${ey}px, transparent ${R}px, #000 ${R+1}px)`;
      ov.style.webkitMaskImage=m;ov.style.maskImage=m;
      appEl.style.transform=`scale(${1.06-.06*e})`;
      if(t<1)requestAnimationFrame(step);
      else{ov.remove();appEl.style.transform="";appEl.style.transformOrigin="";ytBusy=false;after&&after()}
    };
    requestAnimationFrame(step);
  };
  const timer=setTimeout(reveal,2250);
  ov.querySelector(".skip").onclick=()=>{if(S.year!==y)setYear(y,true);clearTimeout(timer);reveal()};
}

// paiements = dépenses « Frais bancaires » marquées frais de compte, remboursements = rémunérations « Remboursement de frais de compte » du même montant
function feeData(id){
  const asc=(a,b)=>a.d<b.d?-1:a.d>b.d?1:a.k-b.k;
  const ac=acc(id);const pays=S.ops.filter(o=>o.a===id&&isFee(o,ac)).sort(asc);
  const refs=S.ops.filter(o=>o.a===id&&o.t==="rem"&&o.c===FEE_REF).sort(asc);
  const used=new Set(),gap=(r,p)=>(pd(r.d)-pd(p.d))/864e5,same=(r,p)=>!used.has(r.id)&&Math.abs(r.m-p.m)<.005;
  // chaque frais est relié au remboursement du même montant arrivé autour de sa date (10 jours avant à 70 jours après)…
  const rows=pays.map(p=>{const r=refs.find(r=>same(r,p)&&gap(r,p)>=-10&&gap(r,p)<=70);if(r)used.add(r.id);return {p,r:r||null}});
  // …sinon à n'importe quel remboursement libre du même montant
  for(const x of rows){if(x.r)continue;const r=refs.find(r=>same(r,x.p));if(r){x.r=r;used.add(r.id)}}
  // un remboursement ne compte que s'il est du montant exact d'un frais (jamais un salaire ou une autre rentrée)
  const extra=refs.filter(r=>!used.has(r.id));
  // un frais sans remboursement est « pas remboursé » dès qu'il est entré
  const pend=ac&&ac.feeRefund===false?[]:rows.filter(x=>!x.r);
  return {rows,extra,pend,paid:pays.reduce((s,o)=>s+o.m,0),back:refs.reduce((s,o)=>s+o.m,0),due:pend.reduce((s,x)=>s+x.p.m,0)};
}
function feeCard(id){
  const a=acc(id);if(!a||!a.fees)return "";
  const f=feeData(id);
  return `<button class="fee-card press ${f.pend.length?"warn":""}" data-fees="${id}">
    <span class="ic">${icon("receipt")}</span>
    <div class="fc-n">${esc(a.feeName||"Frais de compte")}<small>${a.feeRefund===false?`${f.rows.length} prélèvement${f.rows.length>1?"s":""} au total`:f.pend.length?`${f.pend.length} pas remboursé${f.pend.length>1?"s":""}`:`${eurTile(f.back)} remboursés`}</small></div>
    ${f.pend.length?`<span class="fc-badge">${icon("alert")}${eurTile(f.due)}</span>`:a.feeRefund===false?`<span class="fc-sum num">${eurTile(f.paid)}</span>`:`<span class="fc-ok">${icon("check")}</span>`}${icon("chev")}</button>`;
}

  sheet(`<div class="sh-title">Frais de tenue de compte<button class="xbtn" data-close aria-label="Fermer">${icon("x")}</button></div>
    <p class="sub">${esc(a.name)} · tout l'historique</p>
    ${!refund?`<div class="stats"><div class="tile"><div class="v num">${eurTile(f.paid)}</div><div class="k">payé au total</div></div><div class="tile"><div class="v num">${f.rows.length}</div><div class="k">prélèvements</div></div><div class="tile"><div class="v num">${eurTile(f.rows.filter(x=>inYear(x.p)).reduce((s,x)=>s+x.p.m,0))}</div><div class="k">en ${S.year}</div></div></div>`:`<div class="stats">

async function pdfPages(blob,max=15){
  const L=await loadPdfJs();
  const pdf=await L.getDocument({data:new Uint8Array(await blob.arrayBuffer())}).promise;
  const pages=[];let thumb=null;const n=Math.min(pdf.numPages,max);
  for(let i=1;i<=n;i++){
    const pg=await pdf.getPage(i),w0=pg.getViewport({scale:1}).width,vp=pg.getViewport({scale:Math.min(2.4,1500/w0)});
    const c=document.createElement("canvas");c.width=Math.round(vp.width);c.height=Math.round(vp.height);
    const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);
    await pg.render({canvasContext:ctx,viewport:vp}).promise;
    pages.push(await new Promise(r=>c.toBlob(r,"image/jpeg",.84)));

}

// opérations qui correspondent (même montant, date proche)
function findMatches(amount,date,name){
  if(!(amount>0))return [];
  const nw=name?norm(name).split(/[^a-z0-9]+/).filter(w=>w.length>=4):[];
  return S.ops.filter(o=>o.t!=="tri"&&o.t!=="tro"&&Math.abs(o.m-amount)<.015).map(o=>{
    let s=0;if(date){const dd=Math.abs(pd(o.d)-pd(date))/864e5;if(dd>25)return null;s+=12-Math.min(12,dd)}else{const age=(pd(todayISO())-pd(o.d))/864e5;if(age>120)return null;s+=4-age/40}
    if(nw.some(w=>norm(o.l).includes(w)))s+=8;if(hasDoc(o.id))s-=4;return {o,s}}).filter(Boolean).sort((a,b)=>b.s-a.s).slice(0,4).map(x=>x.o);
}
async function analyzeFile(file,tick){
  ocrTick=tick;
  try{
    const prep=await prepFile(file);
    let text="";
    if(prep.type==="application/pdf"){try{text=await pdfText(file)}catch(e){}
      if(text.replace(/\s/g,"").length<30&&prep.pages&&prep.pages[0]){tick&&tick("lecture",0);text=await withTimeout(ocrText(prep.pages[0]),90000)}}
    else{tick&&tick("lecture",0);text=await withTimeout(ocrText(prep.blob),90000)}
    return {prep,info:parseInvoice(text),text};
  }finally{ocrTick=null}
}
// enregistre un fichier déjà préparé
async function storeDoc(prep,name,opId,title){
  const id="d"+uid();await fput(id,{blob:prep.blob,thumb:prep.thumb,pages:prep.pages||null,total:prep.total||0});if(prep.thumb)THUMBS.set(id,prep.thumb);
  S.docs.push({id,opId:opId||null,name:name||"Facture",title:title||"",type:prep.type,size:prep.size,added:todayISO(),pv:prep.thumb?1:0});return id;
}
// importer : lire la facture, puis lier à l'opération trouvée ou en créer une
async function importInvoices(files){
  if(!importAllowed())return;
  if(!files||!files.length)files=await chooseFiles();
  for(const f of files){
    let close,bar,lab;
    close=sheet(`<div class="scan"><div class="scan-ic">${icon("receipt")}</div><b>Lecture de la facture…</b><span id="scLab">${esc(f.name||"")}</span><div class="scan-bar"><i id="scBar"></i></div><p class="hint">La première fois, Zerly télécharge l'outil de lecture (quelques secondes).</p></div>`,
      {mount:w=>{bar=w.querySelector("#scBar");lab=w.querySelector("#scLab")}});
    let res=null,fail=null;
    const t0=Date.now();
    try{res=await analyzeFile(f,(st,p)=>{if(!bar)return;bar.style.width=Math.round(8+(p||0)*92)+"%";lab.textContent=/recogniz|lecture/.test(st)?"Lecture du texte… "+Math.round((p||0)*100)+" %":"Préparation…"})}catch(e){fail=e}
    close();await new Promise(r=>setTimeout(r,Math.max(250,450-(Date.now()-t0))));
    if(!res){
      // lecture impossible (pas d'internet la 1re fois…) : on garde quand même la facture
      try{const prep=await prepFile(f);const id=await storeDoc(prep,f.name,null);save();renderAll();toast("Facture rangée, mais je n'ai pas pu la lire");await new Promise(r=>setTimeout(r,300));linkDoc(id)}catch(e){toast("Impossible de lire « "+(f.name||"ce fichier")+" »")}
      continue;
    }
    await reviewImport(f,res);
  }
}

// virements entre tes comptes : chaque envoi doit avoir sa réception (même montant, à quelques jours près)
function transferIssues(Y){
  const tr=S.ops.filter(o=>(o.t==="tro"||o.t==="tri")&&inYear(o,Y)&&acc(o.a));
  const used=new Set();
  for(const o of tr)if(o.g&&tr.some(x=>x.g===o.g&&x.id!==o.id))used.add(o.id);
  const outs=tr.filter(o=>o.t==="tro"&&!used.has(o.id)).sort((a,b)=>a.d<b.d?-1:1);
  for(const o of outs){let best=null,bd=99;
    // d'abord un autre compte ; sinon le même compte (coffre / poche d'épargne interne)
    for(const x of tr){if(x.t!=="tri"||used.has(x.id)||Math.abs(x.m-o.m)>.005)continue;const dd=Math.abs(pd(x.d)-pd(o.d))/864e5+(x.a===o.a?8:0);if(dd<=15&&dd<bd){best=x;bd=dd}}
    if(best){used.add(o.id);used.add(best.id)}}
  return tr.filter(o=>!used.has(o.id)).sort((a,b)=>a.d<b.d?1:-1);
}

  const cm=isCur?now.getMonth()+1:lm,cym=Y+"-"+pad2(cm),msC=monthStats(cym);
  if(msC.d>msC.g+.5&&msC.d>0)add("warn","out",`${capF(MONTHS[cm-1])} : tu dépenses plus que tu ne gagnes`,`${eurTile(msC.d)} dépensés pour ${eurTile(msC.g)} gagnés, soit ${eurTile(msC.d-msC.g)} de plus.`,{l:"Voir le mois",fn:()=>{ANA.month=cm;ANA.focus="d";go(PG.ana)}});
  // catégories : ce mois-ci comparé à ta moyenne des mois précédents

  if(prev.length>=2){
    // un abonnement annuel ou trimestriel tombe d'un coup : ce n'est pas une hausse
    const rare=new Set(recurring().filter(r=>r.per==="y"||r.per==="q").flatMap(r=>r.ids||[])),dep2=o=>rare.has(o.id)?null:depOf(o);
    const avg={},cnt={},curC=sumBy(cym,dep2);
    for(const p of prev){const r=sumBy(p,dep2);for(const k in r){avg[k]=(avg[k]||0)+r[k]/prev.length;cnt[k]=(cnt[k]||0)+1}}
    const regular=k=>cnt[k]>=Math.ceil(prev.length/2); // on ignore les dépenses ponctuelles
    const ups=Object.keys(curC).filter(k=>regular(k)&&avg[k]>5&&curC[k]>avg[k]*1.4&&curC[k]-avg[k]>25).sort((a,b)=>(curC[b]-avg[b])-(curC[a]-avg[a])).slice(0,3);

      Object.keys(avg2).filter(k=>cnt2[k]>=Math.ceil(pv.length/2)&&avg2[k]>30&&(pc[k]||0)<avg2[k]*.6).sort((a,b)=>(avg2[b]-(pc[b]||0))-(avg2[a]-(pc[a]||0))).slice(0,2)

  }

  const inv=S.accounts.filter(a=>a.invest);

    else if(res>50)add("good","trend","Tes placements rapportent",`${eur(res,true)} depuis le 1er janvier.`,{l:"Voir les placements",fn:()=>{ANA.month=0;ANA.focus="p";go(PG.ana)}})}
  // l'année
  const ys=monthStats(String(Y));
  if(ys.g>0){const rate=(ys.g-ys.d)/ys.g;
    if(rate>=.1)add("good","coins",`Tu as gardé ${Math.round(rate*100)} % de ce que tu as gagné`,`${eurTile(ys.g-ys.d)} de plus gagnés que dépensés depuis janvier. Tu peux en placer une partie sur un livret d'épargne.`);
    else if(rate<0)add("warn","coins","Depuis janvier, tu dépenses plus que tu ne gagnes",`${eurTile(ys.d-ys.g)} d'écart. Repère dans l'Analyse les 2 ou 3 postes les plus lourds pour les réduire.`,{l:"Voir l'analyse",fn:()=>{ANA.month=0;ANA.focus="d";go(PG.ana)}})}
  // conseils
  const me=monthsElapsed(),yc=sumBy(String(Y),depOf),totD=Object.values(yc).reduce((s,v)=>s+v,0);
  if(yc["Abonnements"]>0)add("tip","repeat","Tes abonnements",`Environ ${eurTile(yc["Abonnements"]/me)} par mois (${eurTile(yc["Abonnements"]/me*12)} sur un an). Fais le tri dans ceux que tu n'utilises plus.`,{l:"Voir le détail",fn:()=>{ANA.month=0;openCat("dep","Abonnements",ANA)}});
  const top=Object.entries(yc).sort((a,b)=>b[1]-a[1])[0];
  if(top&&totD>0&&top[1]/totD>.25)add("tip",catIcon(top[0]),`${top[0]} : ton plus gros poste`,`${Math.round(top[1]/totD*100)} % de tes dépenses cette année (${eurTile(top[1])}). C'est là qu'une petite économie compte le plus.`,{l:"Voir le détail",fn:()=>{ANA.month=0;openCat("dep",top[0],ANA)}});

  toolInsights(add);
  // bilan prêt et pas encore regardé
  if(can("wrapped")&&isCur){const t1=todayISO(),seen=S.wrapSeen||{};
    const mk=wrapKey("m"),mn=MONTHS[+mk.slice(5)-1],first=t1.slice(8)==="01";if(!seen["m:"+mk]&&S.ops.some(o=>o.d.startsWith(mk)))add("todo","spark",first?`Ton bilan ${deM(mn)} est disponible`:`Tu n'as pas encore regardé ton bilan ${deM(mn)}`,first?"Ne passe pas à côté : découvre comment s'est passé ton mois.":"Regarde-le avant qu'il ne soit trop tard : il sera remplacé par celui du mois prochain.",{l:"Voir le bilan",fn:()=>openWrapped("m")},"wrapm:"+mk);
    const yk=wrapKey("y");if(t1.slice(5,7)==="01"&&!seen["y:"+yk]&&S.ops.some(o=>o.d.startsWith(yk)))add("todo","spark",`Ton bilan de l'année ${yk} est prêt`,"Toute ton année en quelques images : à ne pas manquer !",{l:"Voir le bilan",fn:()=>openWrapped("y")},"wrapy:"+yk)}
  const dm=S.dismiss||{},t0=todayISO();
  // valeur « u:AAAA-MM-JJ » = caché jusqu'à cette date ; ancienne valeur (date du clic) = caché ce jour-là seulement
  for(let i=out.length-1;i>=0;i--){const d=dm[out[i].k];if(!d)continue;const until=String(d).startsWith("u:")?d.slice(2):addDays(d,1);if(out[i].k.startsWith("op:")||t0<until)out.splice(i,1)}
  if(fb>15)add("tip","card","Frais bancaires",`${eurTile(fb)} de frais bancaires cette année (hors tenue de compte). Compare avec l'offre d'une autre banque si ça continue.`);
  return out;
}

/* ================= roue de date ================= */
function makeWheel(el,{n,label,loop,index,onChange}){
  const H=40,REP=loop?41:1,mid=loop?Math.floor(REP/2):0;
  el.innerHTML=`<div class="wl">${Array.from({length:n*REP},(_,k)=>`<div class="wi">${label(k%n)}</div>`).join("")}</div>`;
  const wl=el.firstChild,items=[...wl.children];let t=0,raf=0,last=index;
  const paint=()=>{raf=0;const c=wl.scrollTop/H;const a0=Math.max(0,Math.floor(c)-4),a1=Math.min(items.length-1,Math.ceil(c)+4);
    for(let k=a0;k<=a1;k++){const d=k-c,a=Math.min(1,Math.abs(d)/2.6);items[k].style.opacity=(1-a*.8).toFixed(3);items[k].style.transform=`perspective(500px) rotateX(${(-d*19).toFixed(1)}deg) scale(${(1-a*.1).toFixed(3)})`}};
  const settle=()=>{const k=Math.round(wl.scrollTop/H),i=((k%n)+n)%n;
    if(loop&&Math.abs(k-(mid*n+i))>n*4){wl.scrollTop=(mid*n+i)*H;paint()}
    if(i!==last){last=i;onChange(i)}};
  wl.addEventListener("scroll",()=>{if(!raf)raf=requestAnimationFrame(paint);clearTimeout(t);t=setTimeout(settle,140)},{passive:true});
  wl.addEventListener("click",e=>{const it=e.target.closest(".wi");if(it)wl.scrollTo({top:items.indexOf(it)*H,behavior:"smooth"})});
  wl.scrollTop=(mid*n+index)*H;paint();
  return {n};
}
function openDatePicker(cur,onPick){
  let [y,m,d]=cur.split("-").map(Number);
  const dim=(y,m)=>new Date(y,m,0).getDate(),Y0=1900,Y1=2300;
  sheet(`<div class="sh-title">Date<button class="xbtn" data-close aria-label="Fermer">${icon("x")}</button></div>
    <div class="dp-prev" id="dpPrev"></div>
    <div class="wheels"><div class="wband"></div><div class="wheel" id="wD"></div><div class="wheel" id="wM"></div><div class="wheel" id="wY"></div></div>
    <button class="primary" id="dpOk">${icon("check")}Valider</button>`,
  {mount:(w,close)=>{
    const prev=()=>{w.querySelector("#dpPrev").textContent=capF(longDate(y+"-"+pad2(m)+"-"+pad2(d)))};
    let wd;
    const mkDay=()=>{const n=dim(y,m);if(d>n)d=n;wd=makeWheel(w.querySelector("#wD"),{n,label:i=>String(i+1),loop:true,index:d-1,onChange:i=>{d=i+1;prev()}})};
    const fix=()=>{if(wd.n!==dim(y,m))mkDay();prev()};
    mkDay();
    makeWheel(w.querySelector("#wM"),{n:12,label:i=>capF(MONTHS[i]),loop:true,index:m-1,onChange:i=>{m=i+1;fix()}});
    makeWheel(w.querySelector("#wY"),{n:Y1-Y0+1,label:i=>String(Y0+i),loop:false,index:Math.min(Y1,Math.max(Y0,y))-Y0,onChange:i=>{y=Y0+i;fix()}});

  }});

async function deleteCat(c,type,done){
  const ops=opsOfCat(c.name,type);let to=null;
  if(ops.length){
    const others=S.cats.filter(x=>x.type===type&&x!==c&&!x.hidden);
    to=await pick(`Où ranger ses ${plural(ops.length,"opération")} ?`,others.map(x=>({label:x.name,value:x.name,icon:icon(catIcon(x.name))})));
    if(to==null)return;
  }else if(!await ask(`Supprimer « ${c.name} » ?`,"Elle ne te sera plus proposée. Tu pourras la remettre depuis Mes catégories.","Supprimer",true))return;
  for(const o of ops){o.c=to;delete o.s}
  if(isBaseCat(c.name,type))c.hidden=true;else S.cats.splice(S.cats.indexOf(c),1);
  save();renderAll();if(done)done();
  toast(ops.length?`« ${c.name} » supprimée · ${plural(ops.length,"opération")} dans ${to}`:`« ${c.name} » supprimée`);
}

// tout ce qu'on peut taper pour retrouver une opération
function opHay(o){const[y,m,d]=o.d.split("-");
  return norm([o.l,o.c,o.s||"",o.n,accName(o.a),TYPES[o.t].l,String(o.m).replace(".",","),MONTHS[+m-1],y,d+"/"+m,d+"/"+m+"/"+y,+d+" "+MONTHS[+m-1],hasDoc(o.id)?"facture":""].join(" "))}
function listOps(){
  if(opsFilter.view==="docs"){listDocs();return}
  const q=opsFilter.q.trim().toLowerCase();
  const qn=parseAmt(q);
  // avec une recherche, on cherche dans toutes les années
  const list=sortOps((q?S.ops:yearOps()).filter(o=>{
    if(opsFilter.acc!=="all"&&o.a!==opsFilter.acc)return false;
    if(opsFilter.type!=="all"&&KIND_OF[o.t]!==opsFilter.type)return false;
    if(q){const hay=opHay(o);if(!matchQ(hay,q)&&!(qn&&Math.abs(o.m-qn)<.005))return false}
    return true;
  }));
  const groups=[];let g=null;
  for(const o of list){const ym=o.d.slice(0,7);if(!g||g.ym!==ym){g={ym,ops:[],net:0};groups.push(g)}g.ops.push(o);g.net+=opsFilter.acc!=="all"||opsFilter.type==="tr"?sv(o):realNet(o)}
  $("oList").innerHTML=`<div class="count">${q?`${list.length} résultat${list.length>1?"s":""} · toutes les années`:`${list.length} opération${list.length>1?"s":""} en ${S.year}`}</div>`+(groups.map(g=>{const[y,m]=g.ym.split("-");return `<div class="month">${MONTHS[+m-1]} ${y}<span class="num">${eur(g.net,true)}</span></div><div class="ops">${g.ops.map(o=>opRow(o,opsFilter.acc==="all")).join("")}</div>`}).join("")||`<div class="empty" style="padding-top:60px">Aucune opération trouvée</div>`);
}

function listDocs(){

// recadrer : on fait glisser la photo et on zoome (doigts, molette ou curseur) pour choisir ce qui apparaît dans le rond
function cropPhoto(img){return new Promise(res=>{let done=null;const V=260,nw=img.naturalWidth,nh=img.naturalHeight,base=Math.max(V/nw,V/nh);let z=1,x=0,y=0;
  sheet(`<div class="sh-title">Recadrer la photo<button class="xbtn" data-close aria-label="Fermer">${icon("x")}</button></div>
    <div class="crop noswipe"><div class="crop-v" id="cpV"><img id="cpI" src="${img.src}" alt="" draggable="false"></div></div>
    <p class="hint" style="margin-top:4px">Fais glisser la photo, et zoome pour choisir ce qui apparaît dans le rond.</p>
    <label class="crop-z noswipe">${icon("search")}<input type="range" id="cpZ" min="1" max="4" step="0.01" value="1" aria-label="Zoom"></label>
    <button class="primary" id="cpOk">${icon("check")}Utiliser cette photo</button>`,
  {mount:(w,close)=>{const v=w.querySelector("#cpV"),im=w.querySelector("#cpI"),zr=w.querySelector("#cpZ");
    const draw=()=>{const k=base*z,iw=nw*k,ih=nh*k,mx=(iw-V)/2,my=(ih-V)/2;x=Math.max(-mx,Math.min(mx,x));y=Math.max(-my,Math.min(my,y));
      im.style.width=iw+"px";im.style.height=ih+"px";im.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px))`;zr.value=z};
    const zoomTo=(nz,cx=0,cy=0)=>{nz=Math.max(1,Math.min(4,nz));const r=nz/z;x=cx-(cx-x)*r;y=cy-(cy-y)*r;z=nz;draw()};
    const P=new Map();let last=null;
    v.addEventListener("pointerdown",e=>{try{v.setPointerCapture(e.pointerId)}catch(_){}P.set(e.pointerId,{x:e.clientX,y:e.clientY});last=null});
    v.addEventListener("pointermove",e=>{if(!P.has(e.pointerId))return;const p0=P.get(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(P.size===1){x+=e.clientX-p0.x;y+=e.clientY-p0.y;draw()}
      else{const [a,b]=[...P.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(last){const rc=v.getBoundingClientRect();zoomTo(z*d/last,(a.x+b.x)/2-rc.left-V/2,(a.y+b.y)/2-rc.top-V/2)}last=d}});
    const up=e=>{P.delete(e.pointerId);last=null};v.addEventListener("pointerup",up);v.addEventListener("pointercancel",up);
    v.addEventListener("wheel",e=>{e.preventDefault();const rc=v.getBoundingClientRect();zoomTo(z*(e.deltaY<0?1.08:1/1.08),e.clientX-rc.left-V/2,e.clientY-rc.top-V/2)},{passive:false});
    zr.oninput=()=>zoomTo(+zr.value);draw();
    w.querySelector("#cpOk").onclick=()=>{const k=base*z,sw=V/k,sx=nw/2-x/k-sw/2,sy=nh/2-y/k-sw/2,S2=400,c=document.createElement("canvas");c.width=c.height=S2;
      c.getContext("2d").drawImage(img,sx,sy,sw,sw,0,0,S2,S2);done=c.toDataURL("image/jpeg",.88);close()};
  },onClose:()=>setTimeout(()=>res(done),320)});
})}

async function saveFile(name,text,mime){
  const blob=text instanceof Blob?text:new Blob([text],{type:mime});
  try{const file=new File([blob],name,{type:mime});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return true}}catch(e){if(e&&e.name==="AbortError")return false}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return true;
}

/* ================= écran d'ouverture ================= */
function playSplash(force){
  return new Promise(done=>{
    const sp=$("splash"),inner=$("spInner"),path=$("spPath"),dot=$("spDot"),rays=$("spRays"),word=$("spWord"),appEl=$("app");
    // remise à zéro
    sp.hidden=false;sp.style.opacity="";sp.style.webkitMaskImage=sp.style.maskImage="";sp.style.pointerEvents="";
    inner.style.transform="";[inner,path,dot,rays,word].forEach(el=>el.getAnimations&&el.getAnimations().forEach(x=>x.cancel()));
    word.innerHTML=[..."Zerly"].map(c=>`<span>${c}</span>`).join("");
    const tag=$("spTag");tag.getAnimations&&tag.getAnimations().forEach(x=>x.cancel());
    const L=path.getTotalLength();
    path.style.strokeDasharray=L;path.style.strokeDashoffset=L;
    dot.style.transform="scale(0)";
    document.documentElement.classList.add("booting");
    const anims=[];const A=(el,k,o)=>{const a=el.animate(k,Object.assign({fill:"forwards"},o));anims.push(a);return a};
    A(path,[{strokeDashoffset:L},{strokeDashoffset:0}],{duration:950,delay:250,easing:"cubic-bezier(.65,0,.35,1)"});
    // le point naît minuscule, grossit au-delà de sa taille, les rayons éclatent, puis tout revient en place
    A(dot,[{transform:"scale(0.02)",offset:0},{transform:"scale(1.9)",offset:.55,easing:"cubic-bezier(.3,0,.2,1)"},{transform:"scale(1.9)",offset:.62},{transform:"scale(1)"}],{duration:1100,delay:1150,easing:"cubic-bezier(.2,.8,.2,1)"});
    A(rays,[{opacity:0,transform:"scale(.35)"},{opacity:1,transform:"scale(1.45)",offset:.45},{opacity:1,transform:"scale(1)"}],{duration:900,delay:1700,easing:"cubic-bezier(.16,1,.3,1)"});
    [...word.children].forEach((s,i)=>A(s,[{opacity:0,transform:"translateX(-10px)",filter:"blur(8px)"},{opacity:1,transform:"none",filter:"blur(0)"}],{duration:520,delay:2050+i*80,easing:"cubic-bezier(.22,1,.36,1)"}));
    let skipped=false,zoomed=false;
    const zoom=()=>{
      if(zoomed)return;zoomed=true;
      anims.forEach(a=>a.finish&&a.finish());
      // centre du point
      const r=dot.getBoundingClientRect(),ir=inner.getBoundingClientRect();
      const cx=r.left+r.width/2,cy=r.top+r.height/2,rad=r.width/2;
      inner.style.transformOrigin=(cx-ir.left)+"px "+(cy-ir.top)+"px";
      const far=Math.hypot(Math.max(cx,innerWidth-cx),Math.max(cy,innerHeight-cy));
      const Smax=far*1.2/rad;
      A(word,[{opacity:1},{opacity:0}],{duration:240,easing:"ease-out"});
      A($("spTag"),[{opacity:1},{opacity:0}],{duration:240,easing:"ease-out"});
      A(path,[{opacity:1},{opacity:0}],{duration:380,easing:"ease-in"});
      A(rays,[{opacity:1},{opacity:0}],{duration:260,easing:"ease-in"});
      // le point grossit, puis une fenêtre s'ouvre dedans → on arrive dans l'appli
      document.documentElement.classList.remove("booting");
      appEl.style.transformOrigin=cx+"px "+cy+"px";
      const t0=performance.now(),D=1150;
      const ss=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)};
      const step=now=>{
        const t=Math.min(1,(now-t0)/D);
        const sc=1+(Smax-1)*t*t*t;
        inner.style.transform=`scale(${sc})`;
        const R=rad*sc*ss((t-.28)/.55);
        const m=`radial-gradient(circle at ${cx}px ${cy}px, transparent ${R}px, #000 ${R+1}px)`;
        sp.style.webkitMaskImage=m;sp.style.maskImage=m;
        const k=ss((t-.3)/.7);appEl.style.transform=`scale(${1.14-.14*k})`;
        if(t<1)requestAnimationFrame(step);else{sp.hidden=true;sp.style.webkitMaskImage=sp.style.maskImage="";inner.style.transform="";appEl.style.transform="";appEl.style.transformOrigin="";done()}
      };
      appEl.style.transform="scale(1.14)";
      requestAnimationFrame(step);
    };
    A(tag,[{opacity:0,transform:"translateY(8px)",filter:"blur(6px)"},{opacity:1,transform:"none",filter:"blur(0)"}],{duration:700,delay:2700,easing:"cubic-bezier(.22,1,.36,1)"});
    const timer=setTimeout(zoom,4100);
    $("spSkip").onclick=()=>{if(skipped)return;skipped=true;clearTimeout(timer);zoom()};
  });
}

function dragDown(el,onClose){let st=null;
